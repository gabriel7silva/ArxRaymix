name: Release

# Pushing a tag such as v1.6 builds the player packages and publishes them as a GitHub Release:
#   ArxRaymix-v1.6.zip                   what players download (and what ArxRaymix.exe installs)
#   ArxRaymix-v1.6.zip.sha256            checked by ArxRaymix.exe before it installs the zip
#   ArxRaymix-v1.6-setup.exe             the Windows installer (scripts/build-installer.ps1), and its .sha256
#   ArxRaymix-v1.6-standalone.zip        the same game without the self-updating launcher: the player runs
#                                        arx.exe and nothing in the package touches the network. This is
#                                        the build mirrored on sites that run their own malware scan.
#   ArxRaymix-v1.6-standalone-setup.exe  installer for that build, and both .sha256 files
# The launcher and the main-menu notice read /releases/latest, so the release goes out as soon
# as the tag is pushed. The tag must match the first line of arx/VERSION ("Arx Raymix 1.6").

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag against arx/VERSION
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $line = (Get-Content arx/VERSION -TotalCount 1).Trim()
          $version = ($line -split ' ')[-1]
          if ($tag -notmatch '^v\d+(\.\d+){1,3}$') {
            throw "Tag '$tag' is not vMAJOR.MINOR[.PATCH[.BUILD]]; the launcher would ignore it."
          }
          if ($tag.Substring(1) -ne $version) {
            throw "Tag '$tag' does not match arx/VERSION ('$line'). Update arx/VERSION first, so the game knows its own version."
          }
      - name: Compile embedded shaders
        run: python scripts/check-shaders.py
      - name: Fetch Streamline
        shell: pwsh
        run: ./scripts/fetch-streamline.ps1
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config RelWithDebInfo --target arx --parallel
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ github.ref_name }}'
      # Mirrors that run their own malware scan get a build without the self-updating
      # launcher, so nothing in it touches the network. Same game, same DLLs.
      - name: Package the standalone build
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ github.ref_name }}' -Standalone
      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          ./scripts/build-installer.ps1 -Version '${{ github.ref_name }}'
      - name: Build the standalone installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version '${{ github.ref_name }}' -Standalone
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(
            "dist/ArxRaymix-$tag-setup.exe",
            "dist/ArxRaymix-$tag-setup.exe.sha256",
            "dist/ArxRaymix-$tag.zip",
            "dist/ArxRaymix-$tag.zip.sha256",
            "dist/ArxRaymix-$tag-standalone-setup.exe",
            "dist/ArxRaymix-$tag-standalone-setup.exe.sha256",
            "dist/ArxRaymix-$tag-standalone.zip",
            "dist/ArxRaymix-$tag-standalone.zip.sha256"
          )
          $missing = $assets | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing release assets: $($missing -join ', ')" }
          gh release create $tag @assets --title "Arx Raymix $tag" --generate-notes --verify-tag
