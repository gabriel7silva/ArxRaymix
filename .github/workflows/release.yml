name: Release

# Pushing a tag such as v1.5 builds the player package and publishes it as a GitHub Release:
#   ArxRaymix-v1.5.zip         what players download (and what ArxRaymix.exe installs)
#   ArxRaymix-v1.5.zip.sha256  checked by ArxRaymix.exe before it installs the zip
# The launcher and the main-menu notice read /releases/latest, so the release goes out as soon
# as the tag is pushed. The tag must match the first line of arx/VERSION ("Arx Raymix 1.5").

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag against arx/VERSION
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $line = (Get-Content arx/VERSION -TotalCount 1).Trim()
          $version = ($line -split ' ')[-1]
          if ($tag -notmatch '^v\d+(\.\d+){1,3}$') {
            throw "Tag '$tag' is not vMAJOR.MINOR[.PATCH[.BUILD]]; the launcher would ignore it."
          }
          if ($tag.Substring(1) -ne $version) {
            throw "Tag '$tag' does not match arx/VERSION ('$line'). Update arx/VERSION first, so the game knows its own version."
          }
      - name: Compile embedded shaders
        run: python scripts/check-shaders.py
      - name: Fetch Streamline
        shell: pwsh
        run: ./scripts/fetch-streamline.ps1
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config RelWithDebInfo --target arx --parallel
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ github.ref_name }}'
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = "dist/ArxRaymix-$tag.zip"
          gh release create $tag $zip "$zip.sha256" --title "Arx Raymix $tag" --generate-notes --verify-tag
