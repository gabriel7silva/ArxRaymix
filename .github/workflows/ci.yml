name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine, minus the Windows renderers, plus the unit tests. CppUnit is not vendored in
  # libs/, so the tests run here, where the distribution packages it.
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libboost-dev libsdl2-dev libglm-dev \
            libopenal-dev libfreetype-dev zlib1g-dev libepoxy-dev libcppunit-dev
      - name: Configure
        run: cmake -S arx -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DICON_TYPE=none
      - name: Build
        run: cmake --build build --target arx arxtest
      - name: Unit tests
        run: ./build/arxtest

  # The real product: MSVC with the vendored dependencies, both D3D backends, DXR and
  # Streamline (DLSS / Frame Generation), exactly as a release build.
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile embedded shaders
        run: python scripts/check-shaders.py
      - name: Fetch Streamline
        shell: pwsh
        run: ./scripts/fetch-streamline.ps1
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config RelWithDebInfo --target arx --parallel
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version "ci-${{ github.sha }}"
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          ./scripts/build-installer.ps1 -Version "ci-${{ github.sha }}"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ArxRaymix-ci
          path: |
            dist/*.zip
            dist/*-setup.exe
          retention-days: 14
