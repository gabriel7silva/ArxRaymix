<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Frame pipeline: Arx engine to D3D9 to the Remix runtime to the path tracer to the screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12100f"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a7663"/>
    </marker>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1000" height="330" fill="url(#bg)"/>

  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" text-anchor="middle">

    <!-- Stage boxes -->
    <g>
      <rect x="24" y="96" width="160" height="76" rx="8" fill="#1b1613" stroke="#3a2e26"/>
      <text x="104" y="128" font-size="15" fill="#f0dcc0">Arx engine</text>
      <text x="104" y="150" font-size="11" fill="#8a7663">level, entities, lights</text>
    </g>

    <g>
      <rect x="228" y="96" width="184" height="76" rx="8" fill="#1b1613" stroke="#3a2e26"/>
      <text x="320" y="122" font-size="15" fill="#f0dcc0">D3D9Renderer</text>
      <text x="320" y="142" font-size="11" fill="#8a7663">untransformed XYZ</text>
      <text x="320" y="158" font-size="11" fill="#8a7663">+ normals + D3DLIGHT9</text>
    </g>

    <g>
      <rect x="456" y="96" width="184" height="76" rx="8" fill="#1b1613" stroke="#4a3a2c"/>
      <text x="548" y="122" font-size="15" fill="#f0dcc0">dxvk-remix</text>
      <text x="548" y="142" font-size="11" fill="#8a7663">.trex/d3d9.dll</text>
      <text x="548" y="158" font-size="11" fill="#8a7663">draw capture</text>
    </g>

    <g>
      <rect x="684" y="96" width="160" height="76" rx="8" fill="#1f1712" stroke="#6a4a26"/>
      <text x="764" y="128" font-size="15" fill="#ffb457">path tracer</text>
      <text x="764" y="150" font-size="11" fill="#8a7663">DLSS · denoiser</text>
    </g>

    <g>
      <rect x="888" y="96" width="88" height="76" rx="8" fill="#1b1613" stroke="#3a2e26"/>
      <text x="932" y="134" font-size="14" fill="#f0dcc0">screen</text>
      <text x="932" y="152" font-size="11" fill="#8a7663">one HWND</text>
    </g>

    <!-- Connectors -->
    <g stroke="#3a2e26" stroke-width="1.6" fill="none" marker-end="url(#head)">
      <path d="M184 134 H222"/>
      <path d="M412 134 H450"/>
      <path d="M640 134 H678"/>
      <path d="M844 134 H882"/>
    </g>

    <!-- One frame travelling the chain. -->
    <g filter="url(#glow)">
      <circle r="4.5" fill="#ffd39a">
        <animateMotion path="M184 134 H952" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- What each hop had to fix, annotated below. -->
    <g font-size="11" fill="#7d6a58" text-anchor="start">
      <text x="228" y="204">world space, w = 0 marks it</text>
      <text x="228" y="222">smooth per-vertex normals</text>
      <text x="228" y="240">map lights as D3DLIGHT9, max 8</text>

      <text x="456" y="204">Direct3DCreate9, not dxvk_CreateD3D9</text>
      <text x="456" y="222">config after RegisterD3D9Device</text>
      <text x="456" y="240">legacy material: rough 0.35, metal 0.12</text>
    </g>

    <!-- The part that is still screen-space, and therefore invisible to the tracer. -->
    <g>
      <rect x="24" y="248" width="380" height="56" rx="8" fill="#191110" stroke="#5a2b28" stroke-dasharray="4 3"/>
      <text x="214" y="270" font-size="12" fill="#d98b7a">still 2D: fire, magic, particles</text>
      <text x="214" y="290" font-size="11" fill="#8a6a60">rasterised as overlay, never traced</text>
      <animate attributeName="opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
    </g>

    <text x="500" y="52" font-size="17" fill="#f0dcc0" letter-spacing="2">ONE FRAME, ONE WINDOW</text>
    <text x="500" y="74" font-size="11.5" fill="#7d6a58">the engine draws D3D9; the Remix runtime is what presents</text>
  </g>
</svg>
