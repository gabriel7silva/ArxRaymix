<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Startup chooses Direct3D 12 or Direct3D 9 once">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12100f"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#c9ac86">
    <text x="40" y="48" font-size="16" letter-spacing="2" fill="#f0dcc0">FRAME STARTUP</text>
    <text x="40" y="88" font-size="13">ARX_RENDERER  or  cfg.ini [video] renderer=</text>
    <text x="40" y="128" font-size="13">SDL2Window → one HWND → one device</text>
    <text x="40" y="168" font-size="13">Direct3D 12 (default)    ·    Direct3D 9 (fallback)</text>
    <text x="40" y="200" font-size="12" fill="#7d6a58">Video Options saves the next launch. This session does not switch.</text>
  </g>
</svg>
