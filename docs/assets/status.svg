<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Progress by area: D3D12, D3D9, textures, world, menu API, effects">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2521a"/>
      <stop offset="100%" stop-color="#ffb457"/>
    </linearGradient>
    <linearGradient id="paneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12100f"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
  </defs>

  <rect width="760" height="300" fill="url(#paneBg)"/>

  <g font-family="Consolas, 'DejaVu Sans Mono', monospace">
    <text x="28" y="40" font-size="15" fill="#f0dcc0" letter-spacing="2">WHERE IT STANDS</text>
    <text x="28" y="60" font-size="11" fill="#7d6a58">honest self-assessment, not a release checklist</text>

    <g>
      <text x="28" y="97" font-size="12" fill="#c9ac86">Direct3D 12 raster window</text>
      <rect x="300" y="86" width="400" height="12" rx="6" fill="#1b1613" stroke="#2c231d"/>
      <rect x="300" y="86" height="12" rx="6" fill="url(#fill)" width="0">
        <animate attributeName="width" from="0" to="380" dur="1.1s" begin="0.1s" fill="freeze"/>
      </rect>
      <text x="712" y="97" font-size="11" fill="#8a7663">95%</text>
    </g>

    <g>
      <text x="28" y="132" font-size="12" fill="#c9ac86">Direct3D 9 fallback</text>
      <rect x="300" y="121" width="400" height="12" rx="6" fill="#1b1613" stroke="#2c231d"/>
      <rect x="300" y="121" height="12" rx="6" fill="url(#fill)" width="0">
        <animate attributeName="width" from="0" to="360" dur="1.1s" begin="0.25s" fill="freeze"/>
      </rect>
      <text x="712" y="132" font-size="11" fill="#8a7663">90%</text>
    </g>

    <g>
      <text x="28" y="167" font-size="12" fill="#c9ac86">Textures, HUD, menus</text>
      <rect x="300" y="156" width="400" height="12" rx="6" fill="#1b1613" stroke="#2c231d"/>
      <rect x="300" y="156" height="12" rx="6" fill="url(#fill)" width="0">
        <animate attributeName="width" from="0" to="360" dur="1.1s" begin="0.4s" fill="freeze"/>
      </rect>
      <text x="712" y="167" font-size="11" fill="#8a7663">90%</text>
    </g>

    <g>
      <text x="28" y="202" font-size="12" fill="#c9ac86">World and entities</text>
      <rect x="300" y="191" width="400" height="12" rx="6" fill="#1b1613" stroke="#2c231d"/>
      <rect x="300" y="191" height="12" rx="6" fill="url(#fill)" width="0">
        <animate attributeName="width" from="0" to="340" dur="1.1s" begin="0.55s" fill="freeze"/>
      </rect>
      <text x="712" y="202" font-size="11" fill="#8a7663">85%</text>
    </g>

    <g>
      <text x="28" y="237" font-size="12" fill="#c9ac86">Video Options API select</text>
      <rect x="300" y="226" width="400" height="12" rx="6" fill="#1b1613" stroke="#2c231d"/>
      <rect x="300" y="226" height="12" rx="6" fill="url(#fill)" width="0">
        <animate attributeName="width" from="0" to="400" dur="1.1s" begin="0.7s" fill="freeze"/>
      </rect>
      <text x="712" y="237" font-size="11" fill="#8a7663">100%</text>
    </g>

    <g>
      <text x="28" y="272" font-size="12" fill="#c9ac86">Fire, magic, particles</text>
      <rect x="300" y="261" width="400" height="12" rx="6" fill="#1b1613" stroke="#2c231d"/>
      <rect x="300" y="261" height="12" rx="6" fill="url(#fill)" width="0">
        <animate attributeName="width" from="0" to="300" dur="1.1s" begin="0.85s" fill="freeze"/>
      </rect>
      <text x="712" y="272" font-size="11" fill="#8a7663">75%</text>
    </g>
  </g>
</svg>
