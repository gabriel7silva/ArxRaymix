[system_tutorial_0]
string="Olhe no baú da loja, pegue os objetos que quiser comprar ou deixe os itens que quiser vender."

[system_tutorial_0bis]
string="Entregue armas ou armaduras quebradas ao ferreiro para que ele as conserte."

[system_tutorial_1] //Jowood version
string="Right-click to toggle from 'CURSOR MODE' to 'MOUSELOOK MODE'."

[system_tutorial_1_new]
string="Clique com o botão direito nesta mensagem para fechá-la."

[system_tutorial_1_new2]
string="As mensagens do tutorial ficam na seção de registro do seu livro de missões (tecla padrão 'F4')."

[system_tutorial_2]
string="Clique e arraste objetos para movê-los. Para colocar um item direto no inventário, clique com o botão esquerdo no objeto enquanto estiver no 'MODO FURTIVO' (tecla padrão 'SHIFT')."

[system_tutorial_2_new]
string="Dê um clique duplo em qualquer objeto fixo para ativá-lo."

[system_tutorial_2bis]
string="Pressione 'ABRIR LIVRO' (tecla padrão 'BACKSPACE') ou clique no ícone do LIVRO para abrir o livro de missões."

[system_tutorial_2tris]
string="Pressione 'ABRIR INVENTÁRIO' (tecla padrão 'I') ou clique no ícone do CINTO para abrir o inventário."

[system_tutorial_3bis] //Jowood Version
string="Equip the bone (Default key 'Enter' or 'F')."

[system_tutorial_3bis_new]
string="Pressione 'PREPARAR ARMA' (tecla padrão 'TAB') para entrar no 'MODO DE COMBATE'."

[system_tutorial_3bis_new2]
string="Clique em 'AÇÃO' para golpear. Quanto mais tempo você segurar o botão, mais forte será o golpe."

[system_tutorial_3]
string="Dê um clique duplo em qualquer personagem para falar com ele."

[system_tutorial_4]
string="Pressione 'PREPARAR ARMA' (tecla padrão 'TAB') para sair do 'MODO DE COMBATE'.*Dê um clique duplo em corpos para abrir o inventário deles."

[system_tutorial_4_new] //Jowood version
string="Left-click and drag items into your inventory.*To use an object press 'ENTER' or 'F'."

[system_tutorial_5]
string="Clique em 'AÇÃO' quando estiver olhando com o mouse para lutar."

[system_tutorial_5bis]
string="Na luta, clique e segure 'AÇÃO' e depois solte para acertar. Quanto mais tempo segurar, mais forte o golpe."

[system_tutorial_6] //JoWood Version
string="You've just found your first runes. Put them in your book (Default key 'Enter' or 'F')."

[system_tutorial_6bis]
string="Agora que você tem as primeiras runas, abra o livro e lance o primeiro feitiço."

[system_tutorial_7]
string="Agache pressionando 'AGACHAR' (tecla padrão 'X') e quebre a armadilha de madeira."

[system_tutorial_8]
string="Dê um clique duplo na corda do inventário depois de encontrá-la e clique no mecanismo do elevador para amarrá-la."

[system_tutorial_9]
string="Clique com o botão esquerdo no ícone de um feitiço para ver a fórmula. A fórmula permanece na tela como referência quando você fecha o livro."

[system_tutorial_10]
string="Pressione e segure 'MODO MÁGICO' (tecla padrão 'Ctrl') para entrar no modo mágico e desenhe as runas com o botão esquerdo do mouse, uma de cada vez. Depois solte 'MODO MÁGICO' para lançar o feitiço."

[system_tutorial_10_bis]
string="Muito bem! Você também pode pré-lançar feitiços para usá-los depois. Para pré-lançar, pressione e segure 'MODO FURTIVO' (tecla padrão 'Shift') enquanto lança o feitiço. Dá para pré-lançar até 3 feitiços."

[system_tutorial_11]
string="Teletransporte ativado; você só poderá viajar pelos portais quando outros teletransportes também tiverem sido ativados"

[system_tutorial_12]
string="Tente acender a lareira e depois coloque comida crua perto do fogo para assá-la"

[system_tutorial_13]
string="Tente lançar o Feitiço de Inflamar nas tochas para iluminar o corredor"

[system_tutorial_14]
string="Pressione 'ENTER' ou 'F' em um Pergaminho Mágico para memorizar o feitiço"

[system_tutorial_15]
string="Agora o feitiço foi pré-lançado. Quando quiser lançá-lo, dê um clique duplo em 'AÇÃO' no símbolo do feitiço que apareceu na parte de baixo da tela"

[system_tutorial_16]
string="Clique no ícone da Escada para mudar de nível."

[system_tutorial_level_01]
string="Parabéns! O nível do seu personagem aumentou! Clique na cruz vermelha para distribuir pontos de experiência extras."

[system_tutorial_level_02]
string="Adicione pontos clicando no ícone de um atributo; o cursor indica quantos pontos ainda restam."

[system_tutorial_17]
string="Para colocar um item, ou uma pilha de itens, direto no inventário, clique com o botão esquerdo no objeto enquanto estiver no 'MODO FURTIVO' (tecla padrão 'SHIFT')."

[system_tutorial_18]
string="Mova a pilha de pães clicando em 'AÇÃO' e arraste para o inventário enquanto estiver no 'MODO FURTIVO' (tecla padrão 'SHIFT')."

[tutorial_bag] //Jowood version
string="Right click on the inventory belt, to show what's inside all your bags."

[tutorial_bag_02] //Jowood version
string="Note you can reorganize your inventory by double clicking on your inventory belt icon."

[tutorial_lever] //Jowood version
string="To repair the mechanism double click on the lever you've just found and then left click on the lever base on the wall nearby."

[tutorial_shop] //Jowood version
string="You're now in transaction mode. BEWARE: A transaction is effective as soon as you pick up an item from, or drop an item into the shopkeeper's chest. You can not change your mind and no refunds are given."

[tutorial_mode_01] //Jowood version
string="You are in cursor mode."

[tutorial_mode_02] //Jowood version
string="You are in Mouselook mode."

[tutorial_stealth] //Jowood version2
string="NPCs can hear you, so mind your footsteps. You can try throwing an item away from you and it might make hostile NPCs move towards it.*Note that the stealth icon shows up in the bottom lefthand corner of the screen when you are hiding."

[tutorial_steal] //Jowood version
string="Did you know that you can steal from people? You need to have at least 50 in stealth to do this. Simply bump into somebody so you can see that person's inventory icon in the bottom-left corner of the screen. Then, left click this icon and have a look at what you'd like to steal: beware though, don't get caught in the act!"

