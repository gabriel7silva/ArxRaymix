[player_dragon8]//{~00~27
String="Não consegui destruir o meteoro só tocando nele..."

[dragon_scenar8]//}~27
String="As coisas nem sempre são tão simples quanto você pensa... Você está enfrentando um deus, Guardião, um adversário poderoso! Precisa ter em seu poder um objeto com poderes mágicos de proteção... Acho que me lembro de que um objeto assim esteve nas mãos dos humanos há algum tempo..."

[player_dragon12]//{~00~27
String="Os Ylsides fizeram prisioneiros todos os humanos do reino..."

[dragon_scenar12]//}~27
String="Pelo pouco que sei dos Ylsides, é melhor você não enfrentá-los cara a cara, meu amigo... Tente ser astuto - é difícil lutar contra o que não se pode ver.."

[player_dragon14]//{~00~27
