[King_Alia_destiny_3bis]//~01 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Céus, o que fazem aqui? Vocês já têm o que queriam: Krahoz está de volta em suas mãos, então não sei o que pensam que estão fazendo aqui..."

[Zalnashh_Alia_destiny_8]//~21 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="O que Krahoz tem a ver com isso? Estamos aqui para celebrar o retorno de Alia para junto dos seus, sua verdadeira família: a nossa Ordem..."

[King_Alia_destiny_6]//~01 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Vocês enlouqueceram?"

[Zalnashh_Alia_destiny_7]//~21@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Talvez você tenha perdido a memória? Contemple este tratado - o próprio pacto firmado entre nossos dois povos por Poxsellis, seu pai: 'Em nome do reino, eu, Rei Poxsellis, Rei de Arx, prometo meu quarto descendente direto à Ordem de Edurneum; em troca, a Ordem fornecerá ao Reino Krahoz e Zohark.' Esta criança nos foi prometida, Lunshire. Deixe-a vir conosco, ou prepare-se para morrer!"

[King_Alia_destiny_4bis]//~01 TO BE TIMED ACCORDING TO ENGLISH VERSION
