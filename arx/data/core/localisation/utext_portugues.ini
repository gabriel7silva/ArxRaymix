String="Fomos atacados por um pequeno grupo de Ylsides; eles me feriram e levaram três dos meus homens..."

[Player_ortiern1]//~00
String="Os Ylsides?"

[Ortiern_briefing2]//~09@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Duas horas atrás, três deles se infiltraram no posto. Atacaram sem aviso nem provocação. Os Ylsides têm fama de guerreiros ferozes e imbatíveis, e agora eu vi com meus próprios olhos.. A velocidade deles é inacreditável, num piscar de olhos derrubaram e arrastaram três dos meus homens... E você deve ter visto o que fizeram com Karnok... Não sei por que fizeram isso, mas sei que não vai demorar para voltarem."

[Player_ortiern2]//~00
String="Procure outra pessoa para ajudar... Já tenho meus próprios problemas..."

[Ortiern_briefing3]//~09@badly wounded
String="Você é minha única esperança! Não posso confiar na ralé da taverna! Prefiro confiar num completo estranho."

[Player_ortiern3]//~00
String="Acabei de lhe dizer que..."

[Player_ortiern4]//~00
String="Isso é ridículo! Você acabou de me dizer que o caminho para o castelo está bloqueado!"

[Ortiern_briefing5]//~09@badly wounded
String="Você deve conseguir passar pelas cavernas dos goblins, dois níveis abaixo, e achar um caminho de volta para este nível. É perigoso e longo, mas não temos escolha! Se achar um jeito de subir até lá, estará de volta ao reino humano."

[Player_ortiern5]//~00
String="Impossível, acabei de fugir de uma prisão goblin!"

[Ortiern_briefing6]//~09@badly wounded
String="Tome, isto vai ajudar; é uma licença de comerciante de pedras preciosas. Enquanto pensarem que você é um vendedor e você não os atacar, provavelmente vão deixá-lo em paz. Eu preciso ficar aqui. Você é nossa única esperança, bravo mercenário!"

[Ortiern_repeat_briefing]//}~09@badly wounded
String="Já lhe disse que você é nossa única esperança?"
string2="Entendeu? Certo... Vá até as cavernas dos goblins com a licença que lhe dei e ache um caminho de volta ao castelo do Rei."
string3="Quando falar com o Rei, ele vai liberar a passagem e mandar reforços para lutar contra os Ylsides..."
string4="Se não fizer isso por mim, faça pelo reino, bravo mercenário!"

[Ortiern_misc_hi]//~09
String="Leal para sempre!"
string2="Mais uma vez, obrigado pela ajuda, mercenário!"

[Kacelbem_misc_before_guardian]//~04@suspicious
String="Não o conheço e não confio em você."
string2="Talvez tenha sido enviado pelo diabo. Por favor, deixe-me em paz."
string3="Você não é um humano comum - você é o diabo! SOCORRO! Eu vi o diabo!"
string4="Herege!"

[Kacelbem_misc_after_guardian]//~04@not suspicious anymore
String="Salve-nos, salve-nos, ó Guardião"
string2="Eu sabia que você não era um simples humano!"
string3="Cumpra seu destino, Guardião, destrua Akbaa!!"
string4="Os hereges perecerão graças a você e ao Noden!"

[player_king_1stmeet1]//{~00~01
String="Meu nome é Am Shaegar. Fugi de uma das prisões goblins e fui enviado por Ortiern. Ele e seus homens estão presos no seu posto avançado. Ele diz que precisa de ajuda para liberar o caminho até o castelo, bloqueado por um desmoronamento. Eles também foram atacados por alguns Ylsides e não vão resistir a outro ataque."

[king_player_1stmeet1]//~01
String="Céus! São notícias graves, Am Shaegar. Você prestou um grande serviço ao nosso reino e tem nossa mais profunda gratidão. Será recompensado à altura dos riscos que correu para nos trazer esta notícia. Mas este desmoronamento não é um problema pequeno, e a solução exigirá certa reflexão."

[king_player_1stmeet1bis]//~01
String="Já decidi o que fazer. Você levará esta mensagem a Pog, rei dos trolls. O povo dele é de mineiros muito habilidosos, eles até ajudaram a construir esta vila. Os trolls vivem um nível abaixo de nós, talvez você já os tenha encontrado... são tão feios quanto os goblins, mas cinco vezes maiores. Ainda assim, as relações entre nossos reinos são excelentes. Partilhamos o ódio pelos homens-rato... Tenho certeza de que ajudarão de imediato."

[player_king_1stmeet2]//~00
String="Parece que não consigo escapar de ser arrastado para tudo isso... Pois bem, vou ajudá-lo, mas espero sua ajuda em troca."

[king_player_1stmeet2]//~01
String="Não tema, você será bem recompensado por esta tarefa."

[player_king_1stmeet3]//~00
String="Ouro de pouco me serve se eu não recuperar a memória!"

[king_player_1stmeet3]//~01
String="Tenho certeza de que tudo vai voltar. Os goblins devem ter lhe dado uma bela pancada na cabeça, só isso. Não se preocupe. E agora, eu lhe imploro, leve esta mensagem como emissário do reino a Pog, rei dos trolls..."

[king_player_1stmeet_misc]//}~01
String="Agora, eu lhe peço, Am Shaegar, vá falar com Pog, o rei dos trolls."
string2="Tenho certeza de que sua memória vai voltar, aos poucos."
string3="Bem, não vejo motivo para você continuar por aqui, não é?"
string4="Depressa! Meus homens estão presos no posto avançado!"

[king_player_rocksaway1]//~01
String="Obrigado mais uma vez, Am Shaegar. As pedras foram removidas. Novamente você mereceu nossa gratidão e esta recompensa. Você se mostrou valioso para o reino, e terei de pensar num cargo mais oficial para você aqui..."

[king_player_rocksaway2]//{~01~11
String="Ah, sim... o que acharia se eu o nomeasse..."

[Carlo_breaks_in1]//~11
String="Majestade... Encontramos sinais de que outro ritual foi realizado..."

[king_player_rocksaway3]//~01
String="Hmm. É o terceiro em menos de uma semana. Onde, desta vez?"

[Carlo_breaks_in2]//~11
String="Perto do duto de ar, Majestade. Acha que pode ter ligação com o assassinato de Falan Orbiplanax?"

[king_player_rocksaway4]//~01
String="Provavelmente... Vou pedir ao meu novo amigo que investigue. Obrigado, Carlo, pode ir!"

[Carlo_breaks_in3]//}~11
String="Muito bem, Majestade."

[king_player_rocksaway5]//{~01~00
String="Bem, então... O que acha disto? Sugiro que investigue esta seita obscura, que tenho quase certeza de que executou Falan Orbiplanax, nosso velho astrônomo. Preciso de alguém que não seja conhecido como agente do Rei, um homem destemido. Você me servirá nesta função?"

[player_king_rocksaway1]//~00
String="Tudo isso é um tanto confuso, Majestade. Mas certamente posso investigar..."

[king_player_rocksaway6]//~01
String="Sei que não vai me decepcionar. Terá liberdade para interrogar qualquer um do meu povo em suas investigações. Guardas, deem a este homem livre acesso aos aposentos privados do castelo! Além disso, caro Am Shaegar, aqui está a chave de um dos aposentos reais, agora é seu. Considere-o seu novo lar."

[player_king_rocksaway2]//~00
String="É um gesto muito gentil..."

[king_player_rocksaway7]//~01
String="Não há de quê! Faremos uma reunião do Conselho assim que trouxer notícias desses acontecimentos perturbadores."

[king_player_rocksaway_misc]//}~01
String="Faremos uma reunião do Conselho assim que você descobrir algumas pistas."
string2="Fico encantado em poder contar com sua ajuda, Am Shaegar."
string3="Gostou do seu novo quarto?"
string4="Que os deuses o ajudem nas suas investigações."

[king_krahoz]//~01
String="Enfim, Krahoz voltou para nós. Muito obrigado por sua honestidade e dedicação, Am Shaegar. Leve-o às Irmãs de Edurneum imediatamente. Elas ficarão felizes em recuperar seu bem precioso e não vão mais me incomodar com isso... O Reino de Arx jamais esquecerá sua coragem."

[player_king_gold]//{~00~01
String="Preciso de muito ouro para salvar Arx..."

[king_player_gold]//}~01
String="Nosso reino está longe de ser fabulosamente rico, Am Shaegar, mas por tudo o que fez por nós e o que pretende fazer, como poderíamos recusar esta modesta quantia..."

[king_gard_warmeet1]//{~01~10
String="Fui informado de agitação nos níveis inferiores da cidade. Alertem os guardas do posto avançado!"

[guard_king_warmeet1]//}~10
String="Às suas ordens!"

[king_warmeet2]//{~01~11~02~20~04
String="Alguma notícia dos Ylsides, meus amigos?"

[carlo_warmeet1]//~11
String="Nossos homens estão segurando a posição, Majestade."

[felnor_warmeet1]//~02
String="Acho que seria prudente localizar o esconderijo deles antes do próximo ataque..."

[chinkashh_warmeet1]//~20
String="Se os humanos entendessem mais de magia, tudo seria bem mais fácil..."

[kacel_warmeet1]//~04
String="Todos esses Ylsides são hereges que precisam ser punidos!..."

[king_warmeet3]//}~01
String="O reino não pode suportar uma ameaça tão constante!"

[king_warmeet4]//{~01~11
String="Há vinte anos, um punhado de rebeldes zomba dos meus melhores homens. Esses dias acabaram, Carlo, entendeu?"

[carlo_warmeet2]//~11
String="Mas, Majestade, quase não tivemos contato com esses rebeldes em todo esse tempo... Talvez eles mesmos tenham se tornado os Ylsides!"

[king_warmeet5]//}~01
String="Não quero ouvir mais talvez, Carlo. Quero resultados, entendeu bem?"

[king_warmeet6]//{~01~02~20
String="Precisamos de mais informações sobre os terremotos. Está ficando cada vez mais preocupante."

[felnor_warmeet2]//~02
String="Pequenos tremores sempre fizeram parte da vida em Arx, mas não há como negar que andam mais frequentes... Suspeito que o canal de energia criado pelos adoradores de Akbaa esteja perturbando a ordem natural... Isso precisa parar, e logo..."

[king_warmeet7]//~01
String="Acha que há risco de um desabamento geral?"

[chinkashh_warmeet2]//~20
String="Se fosse o caso, nossa Ordem já teria descoberto... O verdadeiro perigo no momento é Akbaa..."

[king_warmeet8]//}~01
String="Fiquem atentos, os dois, e me avisem assim que tiverem notícias..."

[king_council_come_start]//{~01~02~04~00~20~03~11~09
String="Muito bem, agora que todos os membros do Conselho estão presentes, comecemos! Felnor, o que encontrou nas anotações de Falan Orbiplanax?"

[felnor_council_see_note]//~02@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Deixe-me ver... Aaaahhh, Falan menciona algo sobre o guarda Erzog. Diz que o viu praticando rituais sombrios com sacrifícios de animais. Talvez Erzog esteja por trás do assassinato de Falan... Ou talvez tenha sido o próprio sumo sacerdote do Culto de Akbaa. Ah, ouçam isto: 'Descobri a existência de um culto que deseja invocar Akbaa em Arx'"

[king_council_take_erzog]//~01
String="Sempre desconfiei desse Erzog. GUARDAS! Joguem Erzog na cela!"

[player_council_mentioned_akbaa]//~00
String="Felnor, quem é esse Akbaa de quem você falou?"

[kacelbem_council_akbaa_demon]//~04
String="Akbaa é um demônio poderoso, o deus da destruição que este culto evidentemente tenta invocar e trazer de volta a Arx. Seria uma blasfêmia permitir que esse ato fosse perpetrado, e um desastre total para todo ser vivo em nosso planeta..."

[felnor_council_contact_noden]//~02
String="Sim, sim, aqui: ouçam o trecho seguinte: 'Esta noite, contactarei o Noden para pedir a ajuda deles.'"

[King_council_noden]//~01
String="O Noden??"

[felnor_council_yes_noden]//~02
String="O Noden é a dimensão que regula a existência dos deuses. Eles mantêm o equilíbrio universal impedindo um desequilíbrio no poder dos deuses."

[kacelbem_council_fallan_really]//~04
String="Se Falan realmente conseguiu contactar o Noden, é possível que tenham enviado um emissário para impedir a vinda de Akbaa..."

[King_council_gardian]//~01
String="Um emissário?"

[felnor_council_gardian]//~02
String="Esses emissários são criaturas de pura energia quando estão no Noden. São enviados para cortar os canais de energia que poderiam tirar os deuses de sua dimensão. Ouvi histórias incríveis de emissários com a força de 100 homens, ou capazes das mais altas formas de magia, outros que são invencíveis. Esses emissários são chamados de Guardiões..."

[kacelbem_council_cinematic_cult]//~04@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Em algum lugar da fortaleza há um culto que recita orações ímpias a um fragmento de meteorito feito inteiramente de um material chamado Koltk. Dizem que esta rocha vem do lugar onde Akbaa nasceu... Normalmente, esta substância é indestrutível. Na verdade, Felnor, só um Guardião do Noden poderia destruir este meteoro..."

[suiberis_council_how_guardian_stop]//~03
String="Como um desses Guardiões poderia impedir a encarnação de um deus só destruindo um pedaço de rocha?"

[kacelbem_council_prayer_heretics]//~04
String="São as orações ímpias dos sacerdotes e seus sacrifícios hediondos que são concentrados pelo meteoro. Ele fornece um canal de energia para Akbaa que, quando reunir o suficiente, poderá completar sua encarnação em Arx. Se isso acontecer, destruição e sofrimento se abaterão sobre nós. Precisamos encontrar e destruir este meteorito a qualquer custo."

[player_council_how_find_guardian]//~00
String="Como vamos encontrar esse Guardião?"

[felnor_council_Koltk_sample]//~02
String="Tenho um fragmento de Koltk no meu laboratório que pode ser de grande ajuda para encontrá-lo."

[king_council_here_situation]//~01
String="Sejamos claros quanto a uma coisa: sabemos que o Culto de Akbaa tem grande presença em Arx e que está ganhando poder. Por sorte, conseguimos deter Erzog, o sumo sacerdote do culto, antes que fosse tarde demais. Mas outros adoradores ainda podem invocar Akbaa. Precisamos encontrar esse famoso Guardião do Noden o quanto antes."

[carlo_council_also_war]//~11
String="Além disso, a guerra com os Ylsides é muito preocupante, Majestade. O que devemos fazer?"

[king_council_shall_brief]//~01
String="Carlo, precisamos de um plano de defesa sólido. Temo o pior. Ninguém sabe ao certo o que são esses Ylsides nem quem os comanda. GUARDAS! Tragam-me o fragmento de Koltk!"

[king_council_while_army]//~01
String="Am Shaegar, enquanto nosso exército enfrenta os Ylsides, precisaremos da sua ajuda para encontrar esse lendário Guardião... Não posso negar que esta tarefa será dura e longa. Na verdade, não fazemos ideia de como o Guardião será, nem se ele já está entre nós. Mas tenho fé na sua capacidade."

[guard_council_here_sample]//~09
String="Aqui está a pedra, Majestade."

[king_council_put_table]//~01
String="Bom. Coloque-a sobre a mesa."

[king_council_take_sample]//~01
String="Pegue esta pedra, Am Shaegar. É uma coisa pequena, mas o Guardião é o único capaz de destruir este fragmento de meteoro. Acima de tudo, tome muito cuidado..."

[carlo_council_aaahhh]//~11
String="Aaaahh!"

[king_council_amazing]//~01
String="Céus!!"

[chinkashh_council_cant_believe]//~20
String="Ffffffff!!"

[felnor_council_so_am_shagar]//~02
String="Mas isso significa que Am Shaegar é..."

[king_council_guardian_well]//~01
String="... O Guardião! Agora tudo faz sentido, principalmente esse seu desejo constante de ajudar os outros! É uma honra conhecê-lo, Guardião!"

[player_council_surprise_for_me]//~00
String="Tocar esta pedra iluminou minha mente. Fui enviado para impedir a vinda de Akbaa e preciso agir sem demora. Primeiro, preciso entrar no templo secreto; lá destruirei a pedra simplesmente tocando-a!"

[felnor_council_noden_with_you]//~02
String="Que a sabedoria do Noden o guie, Am Shaegar."

[king_council_now_go]//}~01
String="Não vamos atrasá-lo mais."

[suiberis_greetings_player]//{~03~00
String="Sou o novo astrônomo. Era assistente do pobre Falan Orbiplanax e, desde a morte dele, faço o possível para cuidar do observatório."

[player_observing_misc]//~00
String="O que as estrelas lhe dizem?"

[suiberis_nothing_stars]//~03
String="Nada. O céu ainda está encoberto."

[suiberis_nothing_misc]//}~03
String="A atual configuração astral é fascinante."
string2="Meu trabalho exige muita concentração, sabe."
string3="Se me dá licença, tenho mesmo muitos cálculos para conferir e muitos horóscopos para preparar..."

[player_rituals_suiberis]//{~00~03
String="Suiberis, o que pode me dizer sobre os rituais? Sabe quem matou Falan Orbiplanax?"

[suiberis_dont_know_rituals]//}~03
String="Sinceramente, não sei do que está falando. Sabe, ainda sou só um novato na minha arte. E, além disso, detesto violência."

[felnor_greetings]//{~02~00
String="Sou Felnor, alquimista do reino e amigo do falecido Falan Orbiplanax."

[player_felnor_falan]//~00
String="Quem era Falan Orbiplanax?"

[felnor_greetings2]//}~02
String="Falan era nosso astrônomo. Morreu há poucos dias. Acho que estava prestes a revelar um plano terrível. Mas não teve tempo de dizer mais nada..."

[felnor_laboratory_generic]//~02
String="Dê uma olhada por aí enquanto eu trabalho..."
string2="Se encontrar algo de interessante no meu laboratório, fique à vontade para pegar."

[player_felnor_falan2]//{~00~02
String="Estou investigando os rituais e a morte de Falan Orbiplanax."

[felnor_falan]//~02
String="Só posso dizer que essas duas coisas estão ligadas... Tenho aqui uma nota que Falan me deu no dia em que morreu, caso algo lhe acontecesse. Nunca entendi bem o que significava. Talvez você entenda..."

[felnor_keep_looking_weapon]//}~02
String="Você precisa usar esta arma lendária, Guardião..."

[Iserbius_welcome]//~03@vicious, he was expecting the player. TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Sei quem você é e por que está aqui! Orbiplanax deve ter tido tempo de contactar o Noden. Eu devia ter cuidado dele antes. Um Guardião! Sua presença aqui é um grande incentivo para nós. Prova que finalmente temos o poder de trazer Akbaa à vida aqui e que ele está mais poderoso do que nunca... Quanto a nós dois, minha doce, continuaremos esta cerimônia mais tarde..."

[Iserbius_incantation]//~03
String="In raaa Nikaaa dum Reanima."

[carlo_statue_guard_post_attack]//{~11~01~00
String="Majestade, nosso posto avançado foi atacado pelos Ylsides. Desta vez, não houve sobreviventes. Pior, não encontramos os corpos. Talvez tenham sido levados..."

[king_statue_damned_where]//~01
String="Céus! Para onde podem ter sido levados?"

[carlo_statue_dont_know]//~11
String="Não sabemos. Foram rápidos e impiedosos. São um inimigo formidável, Majestade."

[king_statue_supposed_linked]//~01
String="Suponho que esses Ylsides façam mesmo parte do Culto de Akbaa..."

[player_statue_you_mean]//~00
String="Sob as ordens de Iserbius?"

[king_statue_no_proof]//~01
String="Não tenho provas de fato, mas ouvimos falar deles pela primeira vez quando o Culto de Akbaa apareceu... Mas há outra coisa: Suiberis deixou o reino recentemente. Ele deve ter percebido que estávamos prestes a descobrir a verdade sobre ele..."

[player_statue_what_truth]//~00
String="Que verdade?"

[felnor_statue_have_figured]//~02
String="Suiberis e Iserbius são a mesma pessoa... Ele está por trás do assassinato de Falan..."

[player_statue_why_iserbius]//~00
String="Agora entendo por que Iserbius estava me esperando no templo! Ele sabia que eu viria!"

[king_statue_so_am_shagar]//~01
String="Então você lutou com ele! Enfim, uma boa notícia... Am Shaegar, diga-me que destruiu a fonte do mal de uma vez por todas."

[player_statue_sorry]//~00
String="Não. Não consegui destruir o meteoro. Em vez disso, senti minha energia se esvaindo... "

[king_statue_damned]//~01
String="Por Deus! Como isso é possível? Felnor, como explica isso?"

[felnor_statue_mhh]//~02
String="Hmmmhh, eu temia que isso acontecesse... A pedra agora está em ressonância com Akbaa e o canal de energia drena tanto sua energia física quanto mágica para alimentar Akbaa... Na verdade, ao tocá-la, você enviou seu próprio poder ao nosso pior inimigo..."

[king_statue_damned2]//~01
String="Mas ainda assim deve haver um jeito de impedir isso..."

[felnor_statue_mhh2]//~02
String="Na época da terrível Guerra dos Magos, há muito, muito tempo, drenos de energia eram comuns e, claro, as proteções contra eles também..."

[king_statue_can_guess]//~01
String="Acho que entendo o que quer dizer, Felnor, mas até meus melhores homens sempre fracassaram nessa busca."

[felnor_statue_not_best_man]//~02
String="Am Shaegar não é um dos seus melhores homens, Majestade, ele é um Guardião, enviado pelos deuses..."

[player_statue_apreciate_explanation]//~00
String="Se acham que existe a menor chance de eu destruir este meteoro, vou achar um jeito de fazê-lo..."

[felnor_statue_your_only_chance]//~02
String="Você precisa se proteger contra o dreno de energia do meteoro. Durante a Guerra dos Magos, a Ordem de Edurneum deu ao reino um artefato de imenso poder. Sem ele, talvez tivéssemos perdido a guerra. Esse artefato era composto de duas peças, Krahoz e Zohark. Qualquer mago que possuísse os dois itens ficava imune a todos os efeitos de dreno de energia. Foi graças a essa proteção que a guerra enfim foi vencida."

[player_statue_where_the_problem]//~00
String="Pois bem, então é só me dar esse objeto..."

[felnor_statue_more_complicated]//~02
String="É aí que a coisa se complica... Na verdade, quando esse objeto nos foi entregue, Poxsellis, pai do nosso atual Rei, assinou um tratado com a Ordem de Edurneum. Esse pacto estipulava que devolveríamos o artefato à Ordem quando ela o pedisse..."

[player_statue_fair_enough]//~00
String="Não vejo nada de errado nisso. E então?"

[king_statue_20_years]//~01
String="Então, 20 anos depois, um grupo de rebeldes surgiu sabe-se lá de onde, matou minha esposa e sequestrou minha filha, que tinha acabado de nascer!!!"

[felnor_statue_steal_krahoz]//~02
String="E, o mais importante, também levaram Krahoz. Por sorte, impedimos que roubassem Zohark. A Ordem apareceu poucas horas depois e exigiu que lhe devolvêssemos o objeto inteiro. Só pudemos lhes dar Zohark e, desde então, exigem que honremos nosso pacto e encontremos Krahoz. Nunca encontramos aqueles rebeldes; nem sabemos se ainda estão sobre a face de Arx, pois só se ouviu falar deles daquela vez. Mesmo assim, a Ordem garante que ainda sente a presença de Krahoz na fortaleza..."

[player_statue_good_news]//~00
String="Muito bem, vou encontrar Krahoz e Zohark..."

[king_statue_now_go_save_misc]//~01
String="Agora vá, Am Shaegar, e salve-nos deste demônio. Encontre Krahoz e Zohark e destrua este meteoro maldito de uma vez por todas..."
