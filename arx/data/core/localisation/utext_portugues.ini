[Fallan_intro_1]//{~02~11~09@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Ouçam-me, Seres de Luz, e prestem atenção ao que tenho a dizer. Esta é Arx, que um dia foi uma cidade como tantas outras, estendendo-se orgulhosa sob a majestade do sol. Nosso rei, Poxsellis, era um rei verdadeiro e justo, que sabia lidar com nossas escaramuças ocasionais com os goblins ou os homens-rato. Muitos anos após a morte de Poxsellis, no ano fatídico de 226, nosso sol começou a declinar e um inverno eterno caiu sobre o nosso mundo... Sua Majestade Lunshire, nobre filho de Poxsellis, decidiu mudar toda a cidade de Arx para o subsolo, para uma das minas abandonadas dos anões. Nesse momento, os conflitos entre as diferentes raças de Arx se dissolveram. Não só humanos, mas anões, trolls e goblins trabalharam juntos pela sobrevivência comum. Essa migração para o subsolo levou cinco anos, durante os quais o sol desapareceu por completo dos nossos céus. Todas as raças construíram seus lares neste novo ambiente e, pouco a pouco, as relações entre as raças voltaram a ser o que sempre tinham sido. Mas hoje, o mal bate às portas..."

[Fallan_intro_2]//~02@dying on the arghh, he's been killed from behind
String="Akbaa, o deus da destruição, está prestes a... argghh!"

