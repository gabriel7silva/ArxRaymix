[calpale_greetings_player]//{~07~00
String="Ei, você parece perdido. Chega aí, tome uma bebida, descanse um pouco. Sou Enoill Calpale, e este buraco de rato é meu lugar favorito. Agora, por que não me conta um pouco sobre você?"

