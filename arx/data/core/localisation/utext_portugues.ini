[system_charsheet_strength]
string="Força. Define o bônus de dano nas lutas e a capacidade de usar armas pesadas. A Força influencia a perícia de conhecimento de objetos e as perícias de combate."

[system_charsheet_intel]
string="Mental. Define sua reserva de mana (energia mágica) e a resistência à magia. O Mental influencia perícias como elo etéreo, magia, perícia técnica, intuição e conhecimento de objetos."

[system_charsheet_Dex]
string="Destreza. Define a precisão no combate e aumenta as chances de golpes críticos. A Destreza influencia a perícia técnica, a furtividade, as perícias de combate e o conhecimento de objetos."

[system_charsheet_consti]
string="Constituição. Define sua reserva de vida, a resistência a veneno e a capacidade de usar armaduras pesadas. A Constituição influencia a Defesa"

[system_charsheet_stealth]
string="Furtividade. Deixa seus passos mais suaves, o que ajuda a se esconder nas sombras, atacar inimigos pelas costas e até bater carteira, quando o nível de furtividade é muito alto."

[system_charsheet_mecanism]
string="Perícia técnica. Permite ter sucesso em tarefas como arrombar portas trancadas e desarmar armadilhas."

[system_charsheet_intuition]
string="Intuição. Uma espécie de sexto sentido que ajuda a detectar objetos escondidos, como passagens secretas e armadilhas. A Intuição também melhora o faro para negócios, permitindo melhores barganhas."

[system_charsheet_etheral_link]
string="Elo etéreo. Esse elo avisa da presença de criaturas hostis e informa o estado do oponente durante as lutas. Essa perícia também define a taxa de recuperação de mana."

[system_charsheet_objknoledge]
string="Conhecimento de objetos. Usado para ações como consertar coisas, preparar poções, envenenar armas e identificar objetos."

[system_charsheet_casting]
string="Conjuração. Essa perícia dá acesso a diferentes níveis de feitiços. Há dez níveis de feitiços. Também define a capacidade de se proteger da magia."

[system_charsheet_projectile]
string="Projétil. Dá bônus de acerto e de dano ao usar qualquer arma de longa distância."

[system_charsheet_closecombat]
string="Combate corpo a corpo. Dá bônus de acerto e de dano ao usar qualquer arma de combate próximo."

[system_charsheet_defense]
string="Defesa. Essa perícia define a capacidade de usar um escudo, aumenta a classe da armadura e reduz o dano sofrido nas lutas."

