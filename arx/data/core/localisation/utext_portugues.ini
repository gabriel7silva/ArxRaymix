[garlic_attack]
string="Ataque de alho!!!!"

// shany sub quest
[note_5000_sons]
string="Agora que você encontrou uma oferenda preciosa para o nosso deus, podemos realizar o ritual. Estarei esperando no pilar das serpentes no 4º nível às dez da manhã de amanhã. De lá, eu o levarei à câmara secreta onde invocaremos os cinco mil filhos da Besta. Tenha muito cuidado para não ser seguido."

[note_alotar_threat_content]
string="Lembre-se — se você não me trouxer as gemas amanhã à noite, você morre. A Irmandade dos Comerciantes de Gemas."

[note_for_pog_content]
string="Pog, Eu: Lunshire, preciso ajuda. Caminho para posto avançado dos humanos bloqueado: pedras grandes. Se trolls puderem desbloquear passagem: eu feliz. - L."

[note_dwarf_mithril]
string="Akanor, acho que estamos prestes a ficar sem mithril. A situação fica mais inquietante a cada dia e não encontro nem uma onça de mithril em nossas minas. Precisamos de uma solução sem demora. Oredak."

[note_jail_contain]
string="Eu vem te substituir depois de eu comer. Você vigiando humanos, você tem que ter cuidado com o novo. Ele parece perigoso.* Anatole."

[description_note_fallan_content]
string="Felnor,**Descobri a existência de um culto que deseja invocar Akbaa em Arx. Akbaa é um demônio poderoso, o deus da destruição que este culto evidentemente tenta invocar e trazer de volta a Arx. Seria uma blasfêmia permitir que esse ato fosse perpetrado, e um desastre total para todo ser vivo em nosso planeta...*Em algum lugar da fortaleza há um culto que recita orações ímpias a um fragmento de meteorito feito inteiramente de um material chamado Koltk. Dizem que esta rocha vem do lugar onde Akbaa nasceu... Normalmente esta substância é indestrutível.*São as orações ímpias dos sacerdotes e seus sacrifícios hediondos que são concentrados pelo meteoro. Ele fornece um canal de energia para Akbaa que, quando reunir o suficiente, poderá completar sua encarnação em Arx. Se isso acontecer, destruição e sofrimento se abaterão sobre nós. Precisamos encontrar e destruir este meteorito a qualquer custo. Na verdade, Felnor, só um Guardião do Noden poderia destruir este meteoro... Esta noite, contactarei o Noden para pedir a ajuda deles.**Falan."

[note_king_bedroom_contain]
string="Ó, Rei, você tem que lembrar — nunca JAMAIS beba vinho — você é alérgico a vinho. Se você beber vinho, você vai ter uma doooor ruim... - Seu mais devoto boticário."

[note_glavasias]
string="Irmão Glavasias, se algum dia precisar desligar o sistema de segurança, anote que o seu código de acesso é 113. O campo de força protetor não deve lhe causar problemas. O Irmão Patrizio e o Irmão Pasquale o ajudarão a desligar os outros sistemas de segurança. - Lord Iserbius."

[note_Patrizio]
string="Irmão Patrizio — este coração é uma das chaves do sistema de segurança. Cuide bem dele. - Lord Iserbius."

[note_Pasquale]
string="Irmão Pasquale — lembre-se disto: o primeiro tranca o segundo. - Lord Iserbius."

[note_gob_guardpost_contain]
string="Meus queridos amigos goblins, como nosso acordo parece continuar, gostaria de confirmar meu pedido de mais dois humanos para sacrificar ao nosso amado Akbaa. Vocês receberão 1000 peças de ouro por cabeça, na entrega. Eu mesmo lhes trarei esta soma principesca. - Lord Iserbius."

[note_mike_lost]
string="Caro Oliver, sinto muito, mas não consigo resolver o quarto enigma. Você acha que poderia me dar uma pista? - Mike."

[note_maria_love]
string="Maria, faz tempo que não conseguimos nos ver e, se a situação não fosse como é, eu faria qualquer coisa no mundo para estar ao seu lado. Seu, - L."

[note_key_brother_treasure]
string="1-3-1 é a chave para abrir os tesouros dos meus irmãos."

//Jowood version 
[note_treasure_hunt_hint#4]
string="Estou muito impressionado com o seu progresso, forasteiro. Então, aqui vai a quarta pista (...usada para encontrar a pista...). Para a próxima pista, encontre a ilha de lava e observe-a de perto."

[player_stone_riddle_first]
string="Viajante, se quiser participar da minha caça ao tesouro, você precisará de uma esmeralda para abrir o meu baú . OLIVER."

[player_note_riddle_second]
string="Ahá, vejo que temos um novo jogador. Bem-vindo, forasteiro. Aqui está a primeira pista: (A chave do tesouro...). Para a próxima pista, vá às minas dos trolls e encontre a nota debaixo das pedras."

[note_carlo_sacred_sword]
string="A Operação Adaga Sagrada acontece amanhã. Esteja preparado. Vou garantir que os guardas não estejam por perto quando você vier e, ainda mais importante, que o Rei esteja profundamente adormecido. Ele não vai suspeitar de nada. Faça bem o seu trabalho e a nossa causa estará protegida. - F."

[note_carlo_calpal]
string="Nota nº 1- Enoill, a Rainha Florence se tornou um perigo para o reino. Siga-a sem ser visto e me informe o que descobrir. - Carlo."

[note_carlo_calpal2]
string="Nota nº 2 - Esta carta que você encontrou confirma minhas suspeitas. A Rainha está tramando assassinar o Rei. Portanto, quero que você providencie o desaparecimento dela. Deixo a hora e o lugar a seu critério. É claro que você será bem recompensado por esta tarefa. Queime esta mensagem depois de lê-la. - Carlo."

[note_carlo_calpal3]
string="Nota nº 3 - Você deve completar sua missão esta noite. Cuide da Rainha o mais rápido possível depois que a criança nascer. Eu mesmo cuidarei da segurança do Rei. - Carlo."

[player_note_riddle_third]
string="Muito bem, forasteiro. Aqui está a segunda pista (... está no nível...). Para a próxima pista, tente ver o que não se pode ver na câmara debaixo das prisões goblins."

[note_dear_mike_sorry]
string="Caro Mike. Sinto muito, mas não seria justo com os outros jogadores se eu lhe desse uma pista do enigma 4. Boa sorte mesmo assim. - Oliver, o Eremita."

[note_at_last]
string="Enfim, chegou a hora. Em breve meu corpo será hospedeiro de Akbaa e, unidos como um só, governaremos Arx. Se algo de ruim acontecer comigo, deixo esta nota para que outra pessoa possa continuar meu trabalho pelo bem de Arx. - Iserbius."

[note_Darkthorn]
string="Ninguém no reino sabe da minha missão. O Rei me escolheu porque sou o melhor caçador de zumbis que existe. Sei que a tarefa não é fácil, mas reuni todas as ferramentas de que preciso para destruir essas abominações! Múmias são oponentes formidáveis, mas são fáceis de eliminar, porque seus cadáveres vivos queimam muito bem. Os outros mortos-vivos são mais difíceis de destruir porque têm o hábito irritante de se levantar de novo quando você acha que acabou com eles. O feitiço para afastá-los só funciona por um curto período, mas não os mata. O melhor jeito, e o único que conheço, de fato, é cravar uma estaca fundo no corpo do morto-vivo antes que ele se levante de novo. Assim, ele será destruído de vez. Não acho que o equipamento que tenho será suficiente. Por sorte, meu prestigioso predecessor me deixou algumas ferramentas muito úteis. Espero conseguir purificar este lugar sagrado para que as pessoas possam voltar a prestar homenagem aos seus mortos. Já fiz uma missão de reconhecimento no primeiro nível da cripta. Mas preciso permanecer alerta aos perigos ao meu redor. Que os deuses estejam com você. - Azrael Darkthorn."

