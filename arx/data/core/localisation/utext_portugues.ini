[Iserbius_call_ylside_2]//~3
String="Guardião, sei que pode me ouvir, pois veste a armadura de um dos meus... O traidor Kultar o salvou desta vez..."

[Iserbius_call_ylside_3]//~3
String="Você tem sorte, Guardião, mas ela não vai durar. Nada em Arx pode impedir a vinda do meu mestre. Já é tarde demais! Akbaa e eu estamos quase lá..."

[Akbaa_dream_1]//~23@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Ahhhhhh.... Mmmmhhhh... Venha até mim... Preciso de você... Entregue-me sua vida..."

[Akbaa_dream_2]//~23@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Guardião! Nada pode impedir minha encarnação em Arx agora! É tarde demais!  Mas por que deveríamos lutar? Junte-se a mim! Você também é prisioneiro do Noden, e só eu posso libertá-lo. Não anseia pela liberdade? Por que continuar escravo do Noden quando poderíamos reinar supremos sobre este mundo como deuses? Seja meu aliado, Guardião, e prometo-lhe um poder além dos seus sonhos..."

[Akbaa_dream_3]//~23@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Muito bem, Guardião... Vejo que rejeitou minha oferta generosa... Talvez em nosso próximo encontro você se arrependa amargamente da sua decisão... Achou mesmo que destruir este meteoro impediria minha encarnação? O canal que resta é suficiente para eu seguir. Posso não ter a força que o sacrifício desses seguidores patéticos me daria, mas, quando eu chegar, minha energia crescerá rapidamente com todas essas almas para beber..."

[King_Alia_destiny_1]//{~01~12~21~26~09 TO BE TIMED ACCORDING TO ENGLISH VERSION
