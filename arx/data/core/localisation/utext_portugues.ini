[player_king_1stmeet1]//{~00~01
String="My name is Am Shaegar. I escaped from one of the goblin prisons and I have been sent by Ortiern. He and his men are trapped at your outpost. He says he needs help to clear the pathway to the castle, which is blocked by a landslide. They have also been attacked by a small number of Ylsides and will be unable to resist another attack."

///FGE
[king_player_1stmeet1]//~01
String="Good heavens!  These are grave tidings, Am Shaegar.  You have done our kingdom a great service, and you have our deepest gratitude.  You will be rewarded commensurate with the risks you've taken to bring us this news.  This cave-in is no small problem, however, and it's solution will take some consideration."

///FGE
[king_player_1stmeet1bis]//~01
String="I have decided on a course of action.  You will take this message to Pog, king of the trolls.  His people are very capable miners, they even helped construct this village.  The trolls live one level below us, you may have encountered them already... they are just as ugly as goblins, but five times the size.  But relations are excellent between our two kingdoms, just the same.  We've a shared hatred for the rat-men... I am sure they will provide immediate help."

///FGE
[player_king_1stmeet2]//~00
String="It seems I can't escape being drawn into these events... Well, I will help you, but I expect your help in return."

[king_player_1stmeet2]//~01
