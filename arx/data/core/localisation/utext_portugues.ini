String="Fale-me sobre esse objeto que você quer em troca de Krahoz."

[Alia_real_introduce_06]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Encontrei antigas lendas sobre 'O Escudo dos Ancestrais', enterrado há muitos anos com um grande guerreiro.  Enviei várias expedições para encontrá-lo, mas até agora sem sucesso.  Traga-me o escudo e Krahoz será seu."

[player_alia_real_introduce_06]//}~00
String="Farei isso."

[Alia_real_introduce_misc]//~12
String="Não traia minha confiança, Am Shaegar."
string2="Uma troca justa: Krahorz pelo escudo."
string3="Veja, nós, os infames rebeldes, não somos tão maus quanto dizem." 

[Alia_player_with_shield_01]//{~12~00
String="Meus espiões dizem que você encontrou o escudo, é verdade?"

[Player_Alia_back_with_shield_01]//~00 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Aqui está."

[Alia_player_back_with_shield_02]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Ah, Am Shaegar, você não faz ideia...  Veja, este escudo é muito mais que um simples artefato mágico; é o escudo do meu avô, o Rei Poxsellis."

[Player_Alia_back_with_shield_02]//~00 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Avô... Então você é..."

[Alia_player_back_with_shield_03]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Alia, filha do Rei Lunshire e da Rainha Florence, Princesa de Arx, a seu dispor."

[Player_Alia_back_with_shield_03]//~00 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Por que continua escondida? Como pode ficar com essas pessoas que sequestraram você e mataram sua mãe?"

[Alia_player_back_with_shield_04A]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="'Essas pessoas' são meus protetores e guarda-costas, a ordem secreta da 'Adaga Sagrada', fundada pelo próprio Rei Poxsellis. Sua única missão é proteger a linhagem real."

[Alia_player_back_with_shield_04B]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Eles não mataram minha mãe. Encontraram-me perto do corpo dela logo depois do meu nascimento. Até hoje, ninguém sabe quem a matou."

[Player_Alia_back_with_news]//~00 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="O assassino dela foi identificado e pagou caro por seus atos.."

[Alia_player_back_with_news]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="É mesmo?  Você é cheio de surpresas, Am Shaegar.  Depois de tanto tempo... é um alívio saber que ela foi vingada."

[Player_Alia_back_with_shield_04]//~00 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Por que você ainda se esconde?"

[Alia_player_back_with_shield_05]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Antes do meu nascimento, a Adaga Sagrada descobriu que as Mulheres-Serpente da Ordem de Edurneum me queriam morta, embora não tenham conseguido descobrir o porquê.  Eles orquestraram meu sequestro para preservar o legado do reino. Pensaram em usar a Guilda dos Viajantes para me levar para longe de Arx, mas a Ordem tem agentes em toda parte, ao que parece."

[Player_Alia_back_with_shield_05]//~00 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Seu pai sabe de alguma coisa disso?"

[Alia_player_back_with_shield_06A]//}}~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Não, não. Ele nem sabe que ainda estou viva!  Para ele, a Adaga Sagrada não passa de um bando de dissidentes e descontentes. E, francamente, eu ficaria mais feliz se continuasse assim - para a segurança dele... Prometa que não vai dizer uma palavra disso a ele."

[Alia_player_back_with_shield_06B]//}}~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Vou honrar minha palavra, é claro, e instruir os guardas a deixá-lo entrar na masmorra onde guardamos Krahorz.  Use-o bem, estranho."

[alia_player_bring_krahoz]//~12
String="Am Shaegar, você é muito gentil, mas acho que isto vai lhe servir melhor na sua missão."

[alia_krahoz_stolen]//~12
String="Se pusermos as mãos no ladrãozinho que roubou Krahoz, vamos mostrar a ele o verdadeiro significado do sofrimento. Vai nos ajudar, Am Shaegar? Se nos ajudar a encontrar o desgraçado, ou se conseguir encontrar e devolver Krahoz, eu o recompensarei... pessoalmente."

[alia_krahoz_stolen_misc]//~12
String="Por favor, traga Krahoz de volta para nós..."
string2="Traga-me a cabeça do ladrão..."

[player_bring_stolen_krahoz]//{~00~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
