[florence_alia_destiny_3]//~26@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Eu fazia parte da Ordem da Adaga Sagrada, uma ordem secreta criada pelo próprio Poxsellis para proteger o Reino de Arx contra todo tipo de perigo. Eu era uma oficial importante da organização, uma das poucas que sabiam do tratado secreto. Arranjei para que Alia fosse sequestrada. Mas, na noite em que ela nasceu, também dei à luz Clarisse, sua irmã gêmea, nascida poucos minutos antes de Alia. Esse nascimento inesperado me deu a ideia de confiá-la à minha criada, que poderia levá-la para fora de Arx, até a Guilda dos Viajantes.  Mas fui assassinada por um visitante inesperado, que enfim foi desmascarado graças a Am Shaegar."

[Zalnashh_Alia_destiny_5]//~21 TO BE TIMED ACCORDING TO ENGLISH VERSION
