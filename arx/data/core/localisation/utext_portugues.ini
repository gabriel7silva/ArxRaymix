///FGE
[Fallan_intro_1]//{~02~11~09@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Listen to me, Beings of Light, and take note of what I have to say. This is Arx, which was once a city like so many others, spreading proudly beneath the majesty of the sun. Our king, Poxsellis, was a true and just king who knew how to deal with our occasional skirmishes with the goblins or the rat-men. Many years after Poxsellis's death, in the fatal year of 226, our sun began to fall into decline and an eternal winter fell upon our world... His Majesty Lunshire, noble son of Poxsellis, decided to move the whole city of Arx underground, into one of the dwarves' abandoned mines. At this point, the conflicts between the different races in Arx dissolved. Not just humans, but dwarves, trolls and goblins all worked together for their common survival. This migration underground took five years, during which the sun disappeared completely from our skies. All the races built their homes in this new setting, and little by little, relationships between the races began to slip back to the way they had always been. But today, evil is knocking at the gates..."

[Fallan_intro_2]//~02@dying on the arghh, he's been killed from behind
String="Akbaa, the god of destruction, is about to... argghh!"

