[player_question_dragon]//~00
String="In what way?"

[dragon_explain_guardian5]//~27
String="Well, it seems that a Guardian develops a sort of foresight, an ability to move around in time which allows them a new vision of critical situations which would otherwise lead them to a dead end, or into defeat. You must have been able to sense that, even if you were perhaps unaware of it. In fact, know this: you are fated to succeed. Do not hesitate to make use of this skill, as it will be of great service to you..."

[player_question_dragon2]//~00
String="Do I have other powers I am not yet aware of?"

[dragon_explain_guardian6]//}~27
String="I think not. It's been a long time since the leaders of the Noden gave great powers to their Guardians... sometimes the cure is worse than the disease... Which brings me to your main weakness: as one of the Noden's creatures, you look like a human and are not native to this dimension. You are free to do most things, but not everything - your ignorance of this dimension, in addition to the things the Noden instilled in you, which you probably have no memory of, will often make you lose your way: perhaps certain conversations you will have will not happen as you expected, the words that come out of your mouth will not be those you would have chosen or even that you would have wanted to say. Do not be concerned, Guardian. You will always be a stranger in Arx, far from human considerations."

