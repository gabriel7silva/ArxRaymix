[dragon_scenar8]//}~27
String="Things are not always as simple as you think... You are up against a god, Guardian, a mighty adversary! You need in your possession an object with magical powers of protection... I think I remember that just such an object was in the hands of the humans a while ago..."

[player_dragon12]//{~00~27
String="The Ylsides have taken all the humans in the kingdom prisoner..."

[dragon_scenar12]//}~27
String="From the little I know of the Ylsides, you'd be better off not taking them on face to face, my friend... Try to be cunning - it is hard to fight what you cannot see.."

[player_dragon14]//{~00~27
String="I seek the secret hideout of Akbaa's followers..."

[dragon_scenar14]//}~27
String="You still haven't tried everything... It's time for the final confrontation, my friend, where the destiny of a member of the Noden takes advantage over the other. You must gather your courage and your determination, show all your knowledge of the enemy and strike him down..."

