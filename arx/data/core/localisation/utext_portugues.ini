[description_book_guardpost]
string="diário de bordo."

[book_guardpost_content]
string="- Ano 266, Estação Branca, Semana do Rato, Terceiro Dia.*Hoje, um pequeno bando de goblins tentou atacar nosso posto avançado. Estavam bêbados e foram fáceis de derrotar. Concluímos, portanto, que não foi um ataque planejado, e sim resultado da enorme quantidade de álcool que tinham consumido. Rechaçamos o ataque sem muita dificuldade, mas mesmo assim perdemos um dos nossos homens, contra cinco perdas do lado dos goblins.*- Ano 266, Estação Branca, Semana da Toupeira, Segundo Dia.*Um terremoto sacudiu nosso posto avançado até os alicerces por pelo menos dez minutos. Não houve danos, mas notei várias rachaduras na passagem que leva à nossa cidade.**- Ano 266, Estação Verde, Semana da Vaca, Quarto Dia.*Um assaltante estranho nos atacou esta manhã. Vestia uma armadura pesada forjada como nenhuma outra que já vimos e parecia invencível. Cada movimento dele era incrivelmente preciso e sua velocidade não tinha rival. Ele não conhecia o significado de misericórdia, pois matou um dos meus homens e feriu gravemente outros dois antes de simplesmente se virar e partir tão rápido quanto apareceu. Seu comportamento me fez suspeitar que o enviaram para avaliar o quanto éramos fortes.*Acho que este guerreiro é apenas o primeiro sinal visível de uma força que agora cresce à sombra e que um dia será poderosa o bastante para aniquilar cada um de nós.***- Ano 266, Estação Verde, Semana da Águia, Primeiro Dia.*O guerreiro estranho voltou. Matou três dos meus homens antes que eu finalmente conseguisse matá-lo. E então, enquanto agonizava, irrompeu numa gargalhada poderosa e demoníaca. Suspeitei imediatamente e ordenei que meus homens recuassem o mais rápido possível. Houve uma explosão enorme que espalhou os restos dele para todos os lados.*Não restou nenhum vestígio salvo a adaga dele no chão.***- Ano 266, Estação Amarela, Semana da Serpente, Primeiro Dia.*Acordamos cedo esta manhã com um terremoto. Um dos meus homens me informou que o tremor causou um deslizamento na passagem que leva ao castelo. Tenho certeza de que a ajuda chegará em breve. Prefiro esperar um pouco antes de enviar um dos meus homens para levar a notícia ao nosso amado Rei. Eles provavelmente já sabem que o deslizamento terá consequências para nós...*Que os deuses nos protejam."
////////////////////////////////////////////////
[description_book_beloved]
string="Meu amado Akbaa."

[book_beloved_content]
string="Estes escritos são criados em honra do meu mestre e Senhor:*Akbaa.***********Akbaa é a fonte do conhecimento por todo o universo e por todas as dimensões conhecidas. Estabelecer contato com o culto dele foi um momento decisivo para o nosso povo e marca o ponto sem retorno. Adore Akbaa ou pereça.**Porque Akbaa é um deus, que também simboliza o poder de destruição de tudo no mundo, ele sabe recompensar os mais leais de seus servos com grandes poderes e pune todos os outros sem misericórdia. Akbaa é imortal, porém precisa de almas para manter o poder sobre o universo conhecido; coletar almas permite que ele espalhe sua sabedoria por toda parte.**Um bom jeito de agradar Akbaa é oferecer-lhe almas ímpias que se recusam a obedecê-lo. Embora os descrentes sejam nossos alvos preferidos, alguns de nós desejam entrar em comunhão com Akbaa e se oferecer em sacrifício. Afinal, a morte não significa nada diante de uma eternidade de alegria e iluminação espiritual.**Um único dia da minha vida vivido como crente vale mais que 1000 anos de vida vividos como descrente.**Pois, graças a Akbaa, vi coisas que me fizeram compreender o funcionamento fundamental do nosso universo. Coisas que estarão eternamente fora do alcance dos descrentes."
////////////////////////////////////////////////
[description_book_iserbius]
string="Diário pessoal de Iserbius."

[book_iserbius_content]
string="É importante para mim deixar a história da minha vida nestas páginas, pois se algo me acontecer, isso ajudará meu sucessor a servir bem a causa da Ordem.**Decidi dedicar toda a minha vida ao meu amado Akbaa. Desde o momento em que soube da existência dele até o meu último suspiro, eu o adorarei.***Akbaa me deu o que nenhum homem jamais poderia sonhar.**Ainda me lembro do dia abençoado em que conheci Lord Long.*Foi no ano 240.**Assim que nossos olhares se cruzaram, uma poderosa afinidade entre nós se tornou evidente. Ele era como um segundo pai para mim, e tenho certeza de que, para ele, eu era o filho que nunca teve.*Algum tempo depois, quando fiz minha primeira entrada verdadeira no culto, ele me fez saber que eu deveria ser o sucessor dele.**Quando eu ainda era noviço, ele me contou tudo sobre o culto e sobre o próprio Akbaa.*Disse-me que o objetivo final do culto era invocar Akbaa em nossa dimensão, que ele havia lançado as bases para que este ritual de invocação acontecesse, mas que, infelizmente, não viveria para ver o dia da sua conclusão.**Graças à sua poderosa clarividência, ele já havia visto a hora da própria morte.Ele me implorou que continuasse os preparativos necessários para cumprir o grande desígnio de Akbaa.**Quando ele morreu no ano seguinte, exatamente como havia previsto, suas palavras proféticas ressoaram em minha mente e, quando eu mal havia sido aceito como membro pleno do culto, fui feito seu Sumo Sacerdote. Este dia marcou meu maior luto e minha maior alegria. O luto imensurável de perder meu mentor e pai, e a alegria indizível de saber que a vinda do nosso Senhor era iminente.**Começou então para mim um longo período de pesquisa.**Fui ficando cada vez mais próximo de Akbaa; tão próximo quanto um mero mortal pode estar de um deus. Vi o que não se pode ver, ouvi coisas que não faziam som e senti coisas que nenhum homem jamais poderia esperar sentir. Akbaa me deu cada vez mais poder, algum poder físico, é claro, mas também um grande domínio das artes mágicas.**Akbaa é mais que um deus para mim, ele é o meu sol, o meu ar e o meu alimento; ele é tudo para mim. Graças à sua inspiração sobrenatural, tomei as rédeas do culto dele com mão de ferro.**Comecei por purgar o culto de membros que já não serviam a um propósito útil. Resultados insatisfatórios agora se mostravam tão perigosos para esses indivíduos quanto a desleixo deles era para nós.*Depois que esta tarefa essencial foi concluída, tive tempo de planejar cada aspecto da chegada de Akbaa, até o menor detalhe. Era essencial que a nossa Ordem permanecesse completamente encoberta até que fosse tarde demais para nos impedir.**Foi então que soube que Falan Orbiplanax havia adivinhado meu verdadeiro propósito e desejava se opor à vinda de Akbaa com a ajuda do Noden.*Para impedir que o Noden se envolvesse, tomei algumas decisões importantes: primeiro, enviei um assassino para matar Orbiplanax, que se tornara um perigo grande demais.**Segundo, adiantei a data da vinda de Akbaa. Porém, não tínhamos tudo pronto para invocá-lo; por isso ordenei que aumentássemos a frequência dos sacrifícios de descrentes, reunindo-os em grande número.*Mulheres e até crianças serviriam, eu não tinha tempo para discriminar...*Além disso, intensifiquei nossas orações, incentivando cada vez mais membros do culto a se oferecerem em sacrifício para que Akbaa finalmente ouvisse nossas preces.**Dia após dia, eu me maravilhava com a soma de conhecimento e poder que Akbaa punha à minha disposição. Para meu assombro, Akbaa prometeu me dar ainda mais após a sua chegada, e que deixaria o destino de Arx em minhas mãos."
////////////////////////////////////////////////
[description_book_cook]
string="Culinária para Goblins, de Durey Palua."

[book_cook_content]
string="Receita de Ciambels.** Misture o açúcar e a farinha.**Adicione a quantidade necessária de água e sove a massa até ficar homogênea.**Quando isso estiver feito, coloque no forno, tomando cuidado para não queimar.**Depois de assado, pegue um ovo de galinha e misture a clara e a gema.**Espalhe esta mistura no bolo e volte ao forno por cerca de um minuto."
////////////////////////////////////////////////
[description_book_music]
string="Uma Nota sobre Música, de Fazzi."

[book_music_content]
string="A flauta é provavelmente um dos instrumentos mais sutis que existem.**Você verá como é fácil aprender, mas, por outro lado, tornar-se virtuoso está longe de ser simples.*Aqui está sua primeira lição se quiser se familiarizar com este instrumento.**Há diferentes tipos de flautas pelo mundo, mas a mais comum funciona da seguinte forma.*É composta de quatro notas básicas e quatro notas modificadas, criadas ao se tapar o orifício na parte de baixo da flauta enquanto as quatro notas básicas são tocadas.*Nós as chamamos 1, 2, 3, 4 para as primeiras quatro notas e #1, #2, #3 e #4 para as quatro notas modificadas.**Uma peça de música bem fácil para começar é algo que chamei de 'Hino de Fazzi' e vai assim: 1 1 #1 3 4 1 1 2."
////////////////////////////////////////////////
[description_book_weapon]
string="A Teoria da Arma Definitiva, de Kartok."

[book_weapon_content]
string="Viajei por muitas terras em busca da arma definitiva.*Passei grande parte da juventude perseguindo este objetivo, mas minhas energias foram desperdiçadas até o dia em que percebi que todos os meus esforços eram em vão.*Em vão, porque o único jeito de encontrar a arma definitiva é criá-la.**Para fazer tal arma, você deve buscar o melhor metal, forjado na melhor forja, e depois aprimorado magicamente com o melhor feitiço que existe.*É muito importante escolher o melhor metal, não só porque ele determina o fio da lâmina e sua resistência, mas porque também deve ser capaz de receber e, portanto, armazenar uma grande quantidade de energia mágica.**Além disso, o peso do metal determinará a manobrabilidade da arma e a eficiência do golpe e da penetração.**A maioria das pessoas usa ferro para forjar suas armas, porque o ferro é o metal mais facilmente disponível.*Mas o melhor metal conhecido hoje (e, na minha opinião, o único a se usar se se quer criar a arma definitiva) é o mithril, o metal mais duro e resistente já descoberto. Ele também pode produzir a melhor liga se misturado com outro elemento.**Porém, o elemento com que se mistura deve ser escolhido com cuidado, e somente os materiais mais raros, que carregam um valor mágico intrínseco em sua própria essência, devem ser usados.*Infelizmente, o mithril (que é um componente vital) é quase impossível de encontrar. Ainda assim, se for possível localizar um pedaço deste metal fantástico, o próximo passo é levá-lo ao melhor ferreiro e pedir que ele forje a arma.*Não entrarei em longos debates filosóficos, mas darei minha opinião clara: para mim, os melhores ferreiros do mundo são os anões.**Toda a tradição deles se baseia em trabalhar pedra e metal e eles dominaram sua arte a tal ponto que até as ferramentas que usam para o ofício são muito superiores às de qualquer outra raça. São os únicos capazes de criar em suas forjas as armas mais afiadas e letais que existem.**A forja é uma etapa importante, pois, no momento em que termina, a arma deve ser capaz de absorver o primeiro feitiço mágico lançado sobre ela e conservar este feitiço para toda a eternidade.**De fato, a etapa final é o encantamento da arma.**Muitas coisas podem melhorar magicamente uma arma — a chave está em escolher o elemento ao qual a arma deve se ligar no momento do encantamento.*Deixe-me dar alguns dos encantamentos mais conhecidos.*A qualidade da arma, porém, depende em última instância mais do metal escolhido e da forja usada do que do elemento com que é combinada...*Aqui vão alguns exemplos, mas note que, uma vez que uma arma tem um encantamento, você não pode mudá-lo:**-O alho confere maior facilidade de manejo da arma.*-O pó de osso acrescenta algum poder à arma, ainda mais eficaz se os ossos vierem de um dragão.*-A rocha de Amikar dá uma resistência incrível a uma arma. Uma vez encantada, a lâmina parece indestrutível.*-Um ovo de dragão permite que a arma cause dano ao elemento de que é feita; por exemplo, uma arma de ferro encantada causará mais dano a objetos de ferro."
////////////////////////////////////////////////
[description_book_noden]
string="As Regras do Noden, a Dimensão dos Deuses, pelo pensador Aran Salar, arquivos (Volume 1)."

[book_noden_content]
string="O Noden, reino dos deuses, existe numa dimensão muito, muito distante da nossa.*Porém, de tempos em tempos, uma ponte é construída entre esta dimensão e a nossa, permitindo a passagem entre elas. Isso pode acontecer devido a convergências astrais favoráveis, como eclipses, ou a grandes cataclismos naturais, como maremotos.**A dimensão que é o Noden funciona assim: existe ali uma energia residual ambiente, que vem de todas as direções do universo conhecido e é atraída para o Noden.*Esta energia representa o poder do inconsciente coletivo dos povos pensantes que vivem nestas dimensões. Contém os desejos, os medos e, de modo mais geral, todas as crenças desses seres.**Assim, cada vez que um ser acredita num deus, dando-lhe um nome, uma cristalização desta entidade se forma no Noden.*No começo, este deus recém-nascido é muito fraco e totalmente indefeso, mas quanto mais fiéis começam a adorá-lo, mais sua energia crescerá no Noden.**Tais deuses muitas vezes são invocados pelos seguidores para algo muito específico. Conforme a vontade e o poder que acumularam, podem recompensar seus adoradores com poder material e vários outros poderes, o que por sua vez reforça a fé que os seguidores têm neles.**Porém, se ninguém acredita num dado deus, a energia deste começará a declinar e será reduzida, nos estágios finais, a uma minúscula forma de ectoplasma, uma sombra frágil da antiga glória.**Vale notar que Krahoz e Zohark ocupam lugar de honra no coração do Noden, graças à adoração que continuam a inspirar entre nós.**O Noden também tem um corpo 'administrativo' que gerencia as residências atribuídas aos diferentes deuses no Noden conforme o número de seguidores que têm, certifica-se de que os deuses não estejam ultrapassando os limites e arquiva crenças drenadas de outras dimensões.*Esta organização também é composta de uma hierarquia e, no ápice, está a raça dos Sybartas, os pensadores.**Sylib Nurath, que trata das interferências entre o Noden e outras dimensões, é um deles.**Outra raça, os Volks, também existe ali. Poderiam ser chamados de servos dos Sybartas. Em geral só executam tarefas repetitivas e menores."
////////////////////////////////////////////////

[description_book_noden_v2]
string="As Regras do Noden, a Dimensão dos Deuses, pelo pensador Aran Salar, arquivos (Volume 2)."

[book_noden_content_v2]
string="As leis do Noden são implacáveis e ninguém (nem mesmo os deuses) pode quebrá-las.**A primeira e mais importante regra é que nenhum deus ou príncipe demônio jamais deixará o Noden (Artigo 1, Capítulo 1); as consequências de um deus ou príncipe demônio em qualquer dimensão qualquer seriam extremamente prejudiciais à harmonia do universo.*Um deus que conseguisse isso ganharia poder infinito e poderia agir em todos os níveis da realidade e da dimensão.**É por isso que deuses e príncipes demônios só devem interagir nas dimensões em que são adorados por sinais, sonhos ou ao dotar humanos aos quais conferem diferentes poderes. Porém, não devem, de forma alguma, passar para aquela dimensão.**Os poucos deuses que ousaram arriscar uma excursão a outras dimensões agora apodrecem dentro de enormes cristais chamados as 'Gemas do Noden', presos pelos Guardiões que Sylib Nurath enviou para trazê-los de volta.*Os Guardiões são, de fato, seres superiores criados pelos Sybartas e enviados pelo Noden para ligar dimensões por eles.*Não são deuses, e sim a 'polícia dos deuses', a quem foi confiado garantir que as regras do Noden sejam respeitadas em todas as outras dimensões.**No começo, os Sybartas costumavam lhes dar grandes poderes para que pudessem trazer de volta os deuses errantes mais depressa, mas assim que perceberam o dano que essa riqueza de poderes poderia causar, concordaram em lhes dar apenas o suficiente para completar a missão.**Porém, foram dotados de uma capacidade excepcional de se adaptar a novas situações e de grande velocidade de aprendizado, permitindo-lhes melhor uso de quaisquer recursos de que dispusessem.*Ao limitar o poder que os Guardiões possuem, tentativas de deificação foram evitadas.**Nenhum mortal pode existir no Noden e qualquer deus que deseje ligar dimensões precisa de um corpo hospedeiro.*Em geral, tais deuses usam o corpo do mortal que invocou a vinda deles, este último muitas vezes jubiloso por se oferecer em sacrifício.**O Noden mantém um registro de todos os deuses que existem ou já existiram.*Lendas em outras dimensões, portanto, falam de Akbaa, Ftaghn-Nayak, Zeus, Zlardos, o Vil, Thrn-Glrn, Alador e muitos outros..."
////////////////////////////////////////////////

[description_book_war_magic]
string="A Guerra dos Magos, de Ourfas Befed."

[book_war_magic_content]
string="No tempo em que os humanos viviam acima do solo, a magia era ensinada em escolas de magia, que ensinavam aos alunos os diferentes métodos possíveis de praticar a arte.**Alguns usavam magia elemental, outros ilusões e, em raras ocasiões e áreas altamente especializadas, até algum necromante era autorizado a praticar.**Os estilos mágicos variavam enormemente, cada um carregando sua própria filosofia, crenças e tabus.*Inevitavelmente, essas filosofias entraram em choque e certos magos tentaram impor seu modo de ver as coisas a outros praticantes de magia.**Isso deu origem a uma guerra aterrorizante.**De fato, nenhum método era verdadeiramente mais forte que outro, então cada batalha era muito equilibrada.*Conforme os confrontos avançavam, cada facção começou a se apoiar num único feitiço para derrotar os oponentes. O feitiço de drenar toda a mana do oponente era, de fato, o feitiço definitivo, pois deixava o adversário drenado incapaz de conjurar até o feitiço mais fraco contra você...**Os magos chegaram a um impasse, com as batalhas reduzidas a um confronto rápido entre duas pessoas lançando um feitiço para drenar a mana uma da outra.**Foi neste ponto que as Irmãs de Edurneum ajudaram o colégio real de magia fornecendo-lhes um poderoso objeto mágico.**Este objeto era composto de dois elementos que, uma vez unidos, permitiam a um mago conservar toda a sua energia mágica, mesmo que alguém tentasse drená-lo.**Estes dois elementos foram nomeados Krahoz e Zohark em memória de dois deuses antigos.**Assim que este objeto foi usado, o conflito cessou, todos os oponentes concordando que a pessoa em posse deste artefato era a mais poderosa.*Krahoz e Zohark foram então dados ao rei de Arx e, desde então, passaram a seus descendentes."
////////////////////////////////////////////////

[description_book_day]
string="O Dia em que Ele Veio."

[book_day_content]
string="Estes fatos são relatados por Lord Long, criador e sumo sacerdote da Ordem Sombria, no ano 199.***********Quando ele veio, eu era um embaixador brilhante a serviço do reino de Arx.*Naquela época, ainda vivíamos na superfície, onde o sol brilhava com toda a sua força.**No 37º dia do ano 216, eu estava no observatório quando houve um eclipse solar e vi um meteorito caindo do céu, em direção à nossa região.*Quando atingiu o solo, houve um terremoto terrível. Pensei imediatamente que era o fim do mundo, mas, quando as coisas se acalmaram, fui ver o ponto de impacto.**No momento em que meus dedos tocaram esta rocha extraterrestre, uma visão me atingiu e me deixou inconsciente.*Enquanto eu jazia inconsciente, algo começou a falar comigo.*A voz me explicou que estava ali para salvar o nosso mundo e que me mostraria o caminho da iluminação.**Senti mãos enormes me agarrarem e ouvi murmúrios dirigidos a mim numa voz profunda e gutural. Então, vi muitas imagens, do começo dos tempos até o presente. Aprendi o nome dele, o nome do meu deus: Akbaa, senhor indiscutível de Arx.**Naquele momento, soube qual era a missão da minha vida: ajudar Akbaa a encontrar seguidores que acreditassem no poder dele.*Quanto mais seguidores eu pudesse encontrar, maior seria o poder do meu Deus. Ele então poderia se reencarnar em Arx e me tornar mestre do mundo.**Assim, construí um templo em honra dele nos túneis subterrâneos não longe da nossa cidade para honrá-lo e espalhar a palavra da religião dele. Também precisei fazer do meteorito Koltk o foco de todas as nossas energias.**O único jeito de satisfazer meu deus era sacrificar-lhe seres pensantes. A adoração e o amor que eu lhe dedicava foram recompensados com numerosos poderes e com o conhecimento de feitiços mágicos, tornando-me muito mais poderoso que um mero humano.*Poder que incutiu medo em centenas de descrentes..."
////////////////////////////////////////////////

[description_book_chicken]
string="O Poder das Galinhas, de Lord Inut, o fazendeiro de Liukalau"

[book_chicken_content]
string="Dediquei a vida inteira ao estudo deste animal incrível: a galinha.**É difícil acreditar que magos horríveis usem descaradamente estas criaturas maravilhosas com tanta frequência para realizar seus rituais malignos, sacrificando-as por sua magia.*Estou convencido de que as galinhas são dotadas de muita intuição e humor.**A raça das galinhas é composta de 57 espécies diferentes, cada uma mais incrível que a outra e cada uma com sua própria cultura e modo de viver.**Passei 8 anos, dia e noite, em contato com galinhas para tentar compreendê-las. Até aprendi a andar como elas para mostrar o meu respeito.**Depois de muita concentração, consegui me transformar numa galinha. Pode-se dizer, então, que sou uma espécie de 'homem-galinha', virando galinha quando a lua é favorável.*Esta nova habilidade, compreensivelmente, teve um efeito maravilhoso nos meus estudos. Pude viver com as galinhas, comer com elas, sentir o que elas sentem, dançar com elas e até falar com elas...**A língua delas é, de fato, muito complexa. Darei alguns exemplos de tradução do galinês para o humano:**Bok significa olá;*Brok?! significa o que você está fazendo?;*BokBok! indica que o que se está prestes a fazer é proibido. *Baaawwwwk mostra um interesse marcado por algo.**Eu poderia entrar em mais detalhes com minhas traduções para mostrar todas as nuances do cacarejo das galinhas, mas acho que um exemplo simples deve bastar para a inteligência de um ser humano normal.**O que descobri sobre a inteligência das galinhas é o quão pronunciado é o senso de altruísmo delas. *Numa comunidade de galinhas, o macho dominante sai pelas áreas próximas em busca de comida se nenhuma for encontrada. Assim que encontra alguma, ele põe um único pé sobre ela e solta um grande 'Braaawwwk' que chama o resto da comunidade para se alimentar.*Ele as observa com um olhar amoroso e só come quando todas as outras já se fartaram.**Como parte da minha experimentação, tento botar um ovo há anos, ainda sem sucesso...*Um estudo recente me sugeriu que talvez isso se deva ao fato de eu ser macho, mas não posso aderir a uma explicação tão simplista.*É por isso que vivo na esperança até hoje..."
////////////////////////////////////////////////
[description_book_mine_log]
string="Diário da Mina, de Isep Ethan, capataz."

[book_mine_log_content]
string="Relatório 87 - Ano 266, Estação Marrom, Terceiro Dia da Semana da Águia.**Depois de semanas e semanas de trabalho duro, finalmente descobrimos um veio de mithril.*Houve um grito de alegria dos trabalhadores e, enquanto estavam diante do ponto em que o veio de mithril emergia, tinham lágrimas nos olhos.*Fica bem longe, a leste.*Como fica bem distante da sala de moagem, construímos um trilho sobre o qual vagonetes transportarão o minério diretamente até a sala de moagem.*********Relatório 88 - Ano 266, Estação Marrom, Segundo Dia da Semana do Rato.**Desde a descoberta do veio, escavamos em todas as direções a partir do ponto inicial.*Quando mineramos para o norte, descobrimos uma cavidade estranha. Parecia ser ao mesmo tempo natural e cavada artificialmente. Havia um forte cheiro animal vindo dela e pensamos que deveria ser o covil de alguma fera selvagem.**Como esta é a Semana do Rato, sinto certa apreensão sobre o que o futuro nos reserva..."
////////////////////////////////////////////////
[description_book_forge_manual]
string="Forja - Manual de Instruções."

[book_forge_manual_content]
string="Para fazer um objeto de metal, você deve usar duas máquinas. Primeiro, deve usar a fundidora de lingotes: esta máquina derreterá o minério para obter um lingote calibrado. Os passos seguintes descrevem como fazer um lingote:**1) Coloque uma pedra poderosa na máquina para lhe dar energia.**2) Coloque dois pedaços grandes de minério no forno. Cuidado para não colocar dois tipos diferentes de minério ao mesmo tempo.**3) Se for preciso ligar o metal, adicione um reagente à mistura.**4) Puxe a alavanca para fazer o lingote.*****Em seguida, a fundição deve ser usada da seguinte forma:**1) Coloque a pedra de poder na máquina para lhe dar energia.**2) Coloque o molde do objeto que deseja fazer no fundidor**3) Coloque o lingote no forno**4) Puxe a alavanca para produzir o objeto desejado."
////////////////////////////////////////////////

[description_book_art_of_making_potions]
string="A Magia das Poções, de Cyro Besali."

[book_art_of_making_potions_content]
string="Fazer as próprias poções é fácil e direto.*Tudo o que se precisa é de meticulosidade e paciência.**Primeiro, você deve encontrar uma garrafa vazia. Depois, precisa do reagente específico de cada poção.*Quando o tiver, esmague-o até virar um pó fino num pilão e almofariz e depois coloque-o num frasco vazio.*Aqueça a mistura com um alambique.*A poção está pronta.**A seguir, uma lista de reagentes conhecidos e reconhecidos:**para poções de mana, use lírio em pó (pó azul);**para antídotos eficazes contra veneno, use ervas medicinais (pó roxo);**para uma poção de invisibilidade, use flor de gota-de-neve em pó (pó branco);**para veneno, use samambaias (pó verde)**e para poções de cura, use flor de lírio-d'água em pó (pó laranja)."
////////////////////////////////////////////////
[description_book_codex]
string="A Farmacopeia da Ordem."

[book_edurneum_codex]
string="Como a pele de uma serpente, assim é a vida de uma rainha**o renascimento deve acontecer para permitir a vinda de uma nova rainha**uma mulher de sangue real**pois só o sangue real pode honrar a Grande Serpente como é devido.**Somente pela Terceira Lua de Ixos o ritual da revelação real pode acontecer."
////////////////////////////////////////////////
[description_book_the_order]
string="A Ordem de Edurneum, de Efan Dirscue."

[book_the_order_content]
string="Sabe-se muito pouco sobre as Irmãs de Edurneum. Até as origens destas criaturas, metade mulher, metade serpente, nos são desconhecidas. Em alguns lugares, a pele delas é coberta de escamas.**Serão algum tipo de raça que data de tempos antigos, ou simplesmente mulheres vítimas de alguma forma de mutação?*Ninguém além delas poderia revelar a resposta a este mistério.*Parecem adorar um deus-serpente, mas não sabemos nada sobre este deus e todos os segredos sobre o culto dele são zelosamente guardados pela irmandade.*Imaginamos que este deus lhes deu seus poderes mágicos, mas, como em todas as outras informações que temos sobre a Ordem, não podemos ter certeza...**Certas lendas afirmam que é a adoração deste deus que é responsável não só pelos poderes mágicos delas, mas também pela transformação em serpentes.*Não há, porém, prova disso.**Desde que o sol de Arx entrou em declínio, os membros da irmandade têm sido os maiores aliados que os humanos já tiveram.*Quando a nossa raça teve de começar a viver no subsolo, as Irmãs ofereceram seus dons mágicos ao Rei para dar vida a uma nova variedade de planta que pudesse crescer sem a luz dos raios do sol, para que os humanos e o gado deles pudessem se alimentar.**A população de Arx tem um grande respeito pelas Irmãs da Ordem de Edurneum e lhes será eternamente grata pelo que fizeram."
////////////////////////////////////////////////
[description_book_history_arx]
string="A História de Arx, de Maioo Kasmadian."

[book_history_arx_content]
string="Nos tempos antigos, cinco tribos humanas habitavam o maior continente do nosso mundo.*Estas tribos estavam sempre em guerra, e quanto mais estruturadas ficavam, pior ficava.*Depois de anos de guerra e um acúmulo de ódio, um homem chamado Poxsellis veio e conseguiu unir estes grupos diferentes.*Ele se tornou o primeiro rei dos humanos.**Depois da última Batalha dos Escudos Estilhaçados, no ano 170, Arx desfrutou do seu mais longo período de paz e prosperidade.**Durante o reinado de Poxsellis, o único período de guerra foi, de fato, as guerras filosóficas do conflito que chamamos de 'a Guerra dos Magos'.*Porém, ainda que esta guerra tenha sido brutal e muita gente tenha morrido nela, de fato durou apenas alguns meses e não teve efeito na liderança política do nosso reino.**Pelo resto do reinado, Poxsellis enfrentou várias ameaças.*Um grande número de invasões goblins foi rechaçado, enquanto homens-rato começaram a viver nos esgotos da cidade.**As batalhas foram sangrentas e esta guerra injusta durou muito tempo, mas os exércitos do reino, liderados pelo próprio Poxsellis, massacraram os inimigos.*E mais uma vez a paz reinou sobre Arx.**A exploração dos oceanos começou.**Muitos barcos fortes saíram ao mar em busca de novas terras e novos tesouros.*Mas em 216, um meteoro caiu na terra do nosso mundo. A princípio, ninguém pensou nada deste fenômeno, mas certos visionários sentiram que era um péssimo presságio para o futuro de Arx.**De fato, poucos anos depois, o nosso sol começou a morrer. A luz ficou cada vez mais rara e a temperatura despencou a níveis perigosos.*Nosso então muito jovem rei, Lunshire, filho de Poxsellis, ordenou que a cidade inteira se mudasse para uma mina de anões desativada nas proximidades.**Foi um trabalho enorme, mas todos sabiam que trabalhavam pela própria salvação, e nenhuma alma se queixou.**Um tratado de paz foi assinado com todas as outras raças, exceto os homens-rato, com quem é impossível conversar.*Porém, os ataques deles diminuíram nesta época.**Todos estavam ocupados salvando Arx, salvando as próprias vidas.*Um tratado foi assinado concedendo um nível da mina a cada raça em troca do trabalho feito.**Esta harmonia durou cinco anos, durante os quais o nosso sol pereceu. Tudo foi feito para salvar os habitantes de Arx, mas mesmo assim muitos perderam a vida.**Além disso, nada se ouviu de nenhuma das outras cidades do continente, e a conclusão lógica foi que tinham feito o mesmo.**Só muito mais tarde chegaram notícias, trazidas por membros da Guilda dos Viajantes.**Outras fortalezas ainda existiam, espalhadas pelo continente, aprisionadas numa espessa casca de gelo.**A Guilda dos Viajantes é agora a única coisa que permite a comunicação, e o tráfego ocasional de produtos de luxo, entre elas.*Além destes contatos esporádicos, Arx é totalmente autossuficiente."
////////////////////////////////////////////////
[description_book_ancient_gods]
string="Os Deuses Antigos, de Abdul Al Raïf."

[book_ancient_gods_content]
string="No começo, os deuses eram onipotentes. Reinaram sobre Arx por éons antes que os humanos fizessem sua primeira aparição.**Sabemos muito pouco sobre os deuses, além do fato de que parece que estavam cheios de ira diante da proliferação dos humanos e desapareceram da superfície da terra.**Alguns escritos muito antigos sugerem que este desaparecimento foi causado pela falta de fé que os primeiros mortais neles demonstraram.*Dois deuses permaneceram mais tempo que todos os outros antes de desaparecer. Seus nomes eram Zohark e Krahoz.**Zohark era o mais poderoso de todos os deuses; ele era o trovão, o relâmpago e os terremotos. Era as tempestades, os furacões e tudo o que representava a força bruta da natureza.*Mas o poder dele só era liberado por Krahoz.**Krahoz era a deusa da equidade, guardiã do equilíbrio e da igualdade.*Os dois precisavam um do outro, o que pode ser o motivo de terem ficado mais tempo que os outros deuses, mas finalmente desapareceram como os demais.*Os tempos modernos viram as crenças antigas abandonadas, e os humanos, que podiam criar magia por si mesmos, tiveram a sua vez de controlar a terra e o relâmpago.**Os humanos entraram numa nova era conceitual em que acreditavam mais nas próprias capacidades e só se voltavam aos deuses para coisas marginais como fertilidade ou hedonismo.*Reverenciavam os deuses da negociação, do ouro e da sorte e até os deuses dos pobres, mas estes primeiros deuses — os deuses das forças brutas da criação — não tinham lugar no panteão.**Desde o início desta nova era e desta mudança de fé, os deuses mais poderosos se recolheram à própria dimensão chamada o Noden, onde aguardam novos adoradores para lhes permitir o retorno."
////////////////////////////////////////////////
[description_book_kings_arx]
string="Os Reis de Arx, de Greenonic Warmhill."

[book_kings_arx_content]
string="Poxsellis foi o nosso primeiro rei. Foi o primeiro a unir as cinco tribos humanas que viviam no nosso continente no ano 170.**Estas tribos tinham estado constantemente em conflito umas com as outras desde o começo, mas nenhuma delas era poderosa o bastante para estabelecer supremacia sobre as outras.*Poxsellis era bom e corajoso e desafiou e derrotou o líder de cada uma das tribos no que veio a ser conhecido como a Batalha dos Escudos Estilhaçados.**Pois, antes de desafiar os líderes tribais, Poxsellis se aventurou num templo abandonado nas Montanhas da Mina dos Lamentos. Deste templo, trouxe um escudo encantado que lhe permitiu derrotar todos os líderes.**Assim que se tornou líder das cinco tribos, Poxsellis se declarou Rei de Arx. Depois disso, reinou sobre o novo reino de Arx com sabedoria, justiça e generosidade.**Teve um reinado longo e próspero, apesar de escaramuças com goblins e homens-rato que, graças ao gênio militar dele, sempre conseguiu conter.**Foi menos afortunado com seus descendentes.*Seus dois primeiros filhos, Elois e Nickus, ambos belos guerreiros, morreram em vida de Poxsellis.**Por sorte, na época da morte dele em 212, seu filho mais novo, Lunshire, restava para sucedê-lo, mas ainda era jovem demais.*Lord Poncet atuou como regente até a maioridade do menino, mas tramou para impedir que Lunshire tomasse o trono. Nunca foi muito popular e o pequeno esquema dele falhou, pois Lunshire tomou o trono em 215, aos 16 anos.**O Rei Lunshire enfrentou uma tarefa difícil desde o começo, pois o sol começou o seu declínio sobre o nosso mundo.*Foi o instigador da migração da população para o subsolo. Fez tudo o que estava ao seu alcance para salvar tantas pessoas quanto as minas dos anões pudessem acolher.**Teve a inteligência diplomática de assinar um tratado com todas as outras raças de Arx, sem o qual a mudança teria levado muito mais tempo, e talvez até tivesse sido interrompida pela era do gelo que se aproximava rapidamente.**O Rei Lunshire honrou a memória do pai transportando o caixão dele para uma nova cripta, construída sobre a fundação do túmulo do mineiro, para que as pessoas nunca perdessem o respeito nem esquecessem este grande rei."
////////////////////////////////////////////////
[description_book_great_inventions]
string="Grandes Invenções de Arx, de Edric Arol."

[book_great_inventions_content]
string="A imaginação humana sempre deu à nossa sociedade invenções fantásticas. Todos se lembram dos gigantescos balões sustentados pelo ar quente que nos deram tão grande capacidade de exploração no passado.*Também proporcionaram um excelente sistema de vigilância contra invasões, permitindo-nos vigiar grandes distâncias.**Outra das mais fabulosas invenções já concebidas foi o submarino.**Esta maravilhosa construção nos trouxe um novo meio de combater piratas e frotas goblins. Isso nos deu supremacia naval durante os anos sombrios de caos e desespero.**Lord Marko, criador desta invenção inestimável, é um dos heróis mais celebrados de todo Arx. Mas a maior invenção humana é, sem dúvida, o reino subterrâneo de Arx.*Talvez não seja tanto uma invenção quanto a conversão de uma estrutura existente. Suas origens são as de uma velha mina de anões com um sistema de ventilação particularmente eficaz.**Já uma estrutura esplêndida, tornou-se ainda mais impressionante graças ao modo como os humanos a organizaram...*A velha mina se tornou um mundo verdadeiramente autônomo, usando todo o espaço disponível. Cada raça conhecida recebeu um nível, de acordo com o tratado assinado no ano 217. Este reino é uma demonstração viva do que a determinação humana pode alcançar."
////////////////////////////////////////////////
[description_book_race_arx_content]
string="As Raças de Arx, de Cebrafi Nin."

[book_race_arx_content]
string="As relações entre as diferentes raças de Arx sempre foram difíceis.**Os goblins eram a mais populosa de todas as raças, em parte devido às altas taxas de fertilidade. Porém, como nunca conseguiram se organizar num reino unido, aos poucos perderam a posição predominante.*No fundo, os goblins não são muito inteligentes. Têm a própria língua e, na maior parte, falam uma espécie de pidgin da língua humana. Estão sempre procurando algo de que reclamar, constantemente irritando a pessoa com quem falam.*São mentirosos, arrogantes, covardes e extremamente preguiçosos.*A única vez em que os goblins foram aliados dos humanos foi durante o grande tratado. Nesse período ajudaram a construir o reino subterrâneo, deixando de lado por um tempo a agressividade natural e os maus modos. Porém, depois que o trabalho terminou e eles se estabeleceram, voltaram aos velhos hábitos.*Parece que o comércio de gemas é a única atividade pacífica que até os mais tolerantes de cada raça conseguem suportar.**Os trolls são outra história.*Mesmo que as origens deles pareçam semelhantes às dos goblins, são completamente diferentes. Têm vontade muito fraca e são criaturas que parecem viver em câmera lenta.*Não são agressivos e são bem mais frequentemente benevolentes. Mas a força monstruosa e a resistência lendária os tornam tanto aliados ponderosos quanto adversários letais.*A existência deles é feita das coisas simples da vida, como encontrar algo para comer ou um lugar para dormir. Por serem mentalmente fracos, são relativamente fáceis de enganar, mas ai de quem o fizer se eles descobrirem, pois a raiva deles é lendária.**Os homens-rato sempre preferiram ter muito pouco contato com as outras raças.*Comunicam-se por sinais mais do que por palavras, às vezes acrescentando sons de arrulho.*Os homens-rato são extremamente ágeis e, assim, adversários formidáveis em combate. Alguns deles são os maiores assassinos de Arx. São muito sutis e extremamente rápidos. Muitas vezes usam armas envenenadas.*Viviam no subsolo, nos esgotos da cidade, quando os humanos ainda viviam na superfície. Alimentar-se de resíduos e excrementos parece lhes convém muito bem.*Até agora, os poucos confrontos que tivemos com os homens-rato foram breves mas sangrentos. Faziam incursões ocasionais nas cidades humanas para vasculhar latas de lixo em busca de comida e ferramentas rudimentares. Desde que se esconderam no subsolo da fortaleza de Arx, aos poucos perderam todo o contato com as outras raças e se movem com discrição exemplar.**Os anões têm paixão por tudo o que é mecânico, pelo artesanato e por tudo o que tem a ver com engenharia; também são os melhores ferreiros do mundo. Já viviam na fortaleza subterrânea bem antes de todas as outras raças também se instalarem ali.*São os únicos que sabem construir minas e explorá-las adequadamente, e muitas vezes vendem os produtos que extraem aos humanos.*Sempre tiveram um relacionamento péssimo com os goblins e travam numerosas guerras contra eles, tentando eliminá-los por completo.*Uma das maiores minas deles foi escolhida como refúgio e local da nova cidade de Arx. Também ajudaram a construir as infraestruturas básicas no local e assumiram muitos trabalhos ali (exceto os do nível goblin). Como já estavam acostumados a viver nas profundezas, se mudaram ainda mais para o subsolo e continuaram a explorar as minas.**A origem das Irmãs de Edurneum é um mistério.*Parecem híbridas entre mulheres e serpentes. A pele é coberta de escamas.*Parece não haver machos na raça delas e nada sabemos sobre como se reproduzem.*São muito talentosas no uso da magia, o que as torna as melhores magas de Arx. Segundo certa lenda, estiveram envolvidas nas próprias origens da magia. Sempre foram muito próximas da raça humana, ajudando-a em cada etapa difícil do desenvolvimento.*Durante a migração, as Irmãs prometeram ajudar o rei dos humanos e criaram plantas subterrâneas para alimentar os habitantes e o gado.**Sabe-se muito pouco sobre dragões. Porém, estudiosos notaram que há 4815 escamas em cada espécime estudado."

////////////////////////////////////////////////
[description_book_known_gods]
string="Conheça Seus Deuses e Demônios, pelo teólogo Bracconus."

[book_known_gods_content]
string="Alador, criado em Omnys, deus benevolente:*Parece ter se retirado depois de ter dado aos humanos livre-arbítrio sobre a dimensão dele e, em particular, a capacidade de controlar o próprio destino.*Supõe-se que tenha sido muito poderoso, mas nunca exibiu todos os seus poderes antes de deixar a dimensão de Omnys.**Xarm, criado em Omnys, deus maligno:*o exato oposto do deus anterior.*Xarm ficou muito irado com Alador pela independência que este deu aos humanos. Vendo que não podia tirá-la deles, empreendeu tentá-los sob seu controle reduzindo-os à escravidão.**Akbaa, criado em Koltk, deus maligno:*chamado o deus da destruição porque destruiu Koltk por completo, foi inicialmente adorado pelos seguidores por causa da ajuda que lhes deu durante suas guerras e conflitos.**Tirkio, criado em Arx, deus benevolente:*despreza a futilidade dos ricos. É aconselhável se livrar de todas as peças de ouro antes de fazer qualquer tipo de negócio com ele."
