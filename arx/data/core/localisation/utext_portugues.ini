[Alia_alia_destiny_3]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Chega! Nada mais de derramamento de sangue. Honrarei a palavra de Poxsellis. Não sei o que me aguarda na Ordem de Edurneum, mas não cabe a mim julgar este tratado... O reino jamais teria vencido a Guerra dos Magos sem a ajuda da Ordem, e devemos honrar nossas promessas. Pai, eu aceito isto,  porque, a meus olhos, a honra é a qualidade mais importante. Espero que nos vejamos de novo em breve, mas temo que precise deixá-lo agora..."

