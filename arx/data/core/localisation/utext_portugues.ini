[player_alia_father]//~00
String="A decisão tem de ser sua."

[alia_revelations_father_2]//}~12
String="Por favor, mostre a ele isto, meu anel de sinete.  A Adaga Sagrada o guardou como prova da minha linhagem quando me salvou. Diga ao meu pai que vou esperá-lo junto ao lago..."

[alia_debriefing]//~12
String="Obrigada, Am Shaegar.  Tudo isso é muito confuso, tanta coisa aconteceu tão depressa... Conheci o pai que nunca tive, descobri que em algum lugar tenho uma irmã...  Vai levar tempo para me acostumar a tudo isso.  Mas de uma coisa tenho certeza: sou sinceramente grata por tudo o que você fez por nós."

[alia_debriefing_unhappy]//~12@she coldly thanks the player, because he did some bad things together with some good things
String="Am Shaegar... Tenho certeza de que você merece agradecimentos pelo que fez.  Depois que as mulheres-serpente invadiram nosso acampamento e me capturaram, perdi toda a esperança. Mas, presa lá, ouvi uma voz, ao mesmo tempo estranha e familiar.  Era minha mãe, cujo espírito você libertou ao encontrar o assassino dela... ela me consolou e depois explicou às mulheres-serpente que eu não era quem elas procuravam.  Am Shaegar, em vez de agradecer pelo que você fez, prefiro agradecer pelo que ainda precisa fazer: salvar o nosso mundo de Akbaa."

[sacred_sword_debriefing_unhappy]//~10@dying
String="Am Shaegar... seu traidor imundo,  Que Akbaa o leve!   O que poderíamos ter feito a você para que nos vendesse às mulheres-serpente?  *cof, cof* Uma maldição sobre você e aquela maldita Ordem..."

[sacred_sword_debriefing_sad]//~10@dying
