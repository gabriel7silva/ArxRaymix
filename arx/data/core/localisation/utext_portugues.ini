[alia_bring_krahoz-zohark2]}~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="A última vez que esses dois objetos foram unidos, foi pelas mãos do meu avô, o Rei Poxsellis..."

[alia_let_shield]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Quanto ao Escudo dos Ancestrais, não precisamos mais dele. Fique com ele como sinal da nossa gratidão."

[Alia_thanks_krahoz]//~12@almost whispers at the end
String="Obrigada por fazer isso por nós, Am Shaegar... Sabe, passei a valorizar muito os seus conselhos... Por favor, fique aqui comigo um momento..."

[alia_nightmare]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Aonde você vai, Am Shaegar? Está descontente comigo? Sei como sua missão é importante, mas..."

[alia_nightmare2]//~12@becoming manic TO BE TIMED ACCORDING TO ENGLISH VERSION
