[king_council_come_start]//{~01~02~04~00~20~03~11~09
String="Very well, now that all the members of the Council are present, let us begin! Felnor, what have you found in Falan Orbiplanax's notes?"

[felnor_council_see_note]//~02@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Let me see... Aaaahhh, Falan mentions something about the guard, Erzog. He says he saw him practising dark rituals involving animal sacrifices. Perhaps it was Erzog who is behind Falan's murder... Or perhaps it was even the high priest of the Cult of Akbaa. Oh, listen to this: 'I have discovered the existence of a cult which wishes to invoke Akbaa onto Arx'"

[king_council_take_erzog]//~01
String="I was always suspicious of that Erzog. GUARDS! Throw Erzog into the cells!"

[player_council_mentioned_akbaa]//~00
String="Felnor, who is this Akbaa I heard you speak of?"

[kacelbem_council_akbaa_demon]//~04
String="Akbaa is a powerful devil, the god of destruction that this cult is evidently trying to invoke and bring back to Arx. It would be blasphemy to allow this act to be perpetrated, and a total disaster for every living being on our planet..."

[felnor_council_contact_noden]//~02
String="Yes, yes, here: listen to the next bit: 'This evening, I will contact the Noden to ask for their help.'"

[King_council_noden]//~01
String="The Noden??"

///FGE
[felnor_council_yes_noden]//~02
String="The Noden is the dimension which regulates the existence of gods. They maintain the universal equilibrium by preventing an imbalance in the power of gods."

[kacelbem_council_fallan_really]//~04
String="If Falan really had been able to contact the Noden, it is possible they may have sent an emissary here to stop the coming of Akbaa..."

//** grassini new text
[King_council_gardian]//~01
String="An emissary?"

///FGE
[felnor_council_gardian]//~02
String="These emissaries are creatures of pure energy when they are on the Noden. They are sent to cut off the energy channels which might drive the gods out of their dimension. I have heard amazing tales of emissaries who have the strength of 100 men, or who can perform the highest forms of magic, others who are invincible. These emissaries are called Guardians..."

[kacelbem_council_cinematic_cult]//~04@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Somewhere in the fortress is a cult which recites impious prayers to a fragment of a meteorite made entirely of a material called Koltk. This rock is said to come from the place where Akbaa was born... Normally, this substance is indestructible. In truth, Felnor, only a Guardian of the Noden could destroy this meteor..."

///FGE
[suiberis_council_how_guardian_stop]//~03
String="How could one of these Guardians stop the incarnation of a god just by destroying a piece of rock?"

///FGE
[kacelbem_council_prayer_heretics]//~04
String="It is the impious prayers of the priests and their hideous sacrifices which are focused by the meteor. It provides a channel of energy for Akbaa who, when he has gathered enough, will be able to complete his incarnation in Arx. If that happens, destruction and suffering will be unleashed upon us.  We must find and destroy this meteorite at any cost."

[player_council_how_find_guardian]//~00
String="How will we find this Guardian?"

///FGE
[felnor_council_Koltk_sample]//~02
String="I have a fragment of Koltk in my laboratory which may be of great assistance in finding him."

[king_council_here_situation]//~01
String="Let's be clear about one thing: we know that the Cult of Akbaa has a great presence in Arx, and that it is gaining power. Luckily, we were able to stop Erzog, the cult's high priest, before it was too late. But other worshippers could still invoke Akbaa. We must find this famed Guardian of the Noden as soon as possible."

///FGE
[carlo_council_also_war]//~11
String="In addition, the war with the Ylsides is very troubling, Your Majesty. What should we do about it?"

[king_council_shall_brief]//~01
String="Carlo, we need a solid plan of defence. I fear the worst. Nobody knows exactly what these Ylsides are or who commands them. GUARDS! Bring me the fragment of Koltk!"

///FGE
[king_council_while_army]//~01
String="Am Shaegar, while our army is facing the Ylsides, we will need your help to find this legendary Guardian... I cannot deny that this task will be harsh and lengthy. In fact, we have no idea what the Guardian will look like or even if he is already among us. But I have faith in your capabilities."

[guard_council_here_sample]//~09
String="Here is the stone, Your Majesty."

[king_council_put_table]//~01
String="Good. Put it on the table."

[king_council_take_sample]//~01
String="Take this stone, Am Shaegar. It is a small thing, but the Guardian is the only one who is capable of destroying this fragment of meteor. Above all, take great care..."

[carlo_council_aaahhh]//~11
String="Aaaahh!"

[king_council_amazing]//~01
String="Great heavens!!"

