// quest log goals

[system_Quest_log_escape_gobs]
string="Estou nesta prisão goblin. Preciso escapar daqui e descobrir quem eu sou!"

// newlog
[system_Quest_log_escape_gobs_done]
string="Consegui escapar do posto avançado goblin. Ainda não faço ideia do que estou fazendo aqui..."

[system_Quest_log_gob_authorization]
string="O lorde goblin que guarda o acesso ao segundo nível dos goblins pediu uma autorização por escrito e uma licença de comerciante de gemas."

// newlog
[system_Quest_log_gob_authorization_done]
string="Passei pelo lorde goblin que guardava a área do reino goblin"

[system_Quest_log_message_ortiern]
string="Preciso falar com o Rei de Arx e levar a ele notícias do posto avançado dos humanos."

[system_Quest_log_greu_gift]
string="Encontrei um troll hoje. Ele quer que eu seja amigo dele e gostaria de um presente de aniversário..."

// newlog
[system_Quest_log_greu_gift_done]
string="Dei um livro para Greu. Ele ficou feliz e me deu um amuleto de troll. Fiz um novo amigo hoje."

[system_Quest_log_fallen_rocks]
string="O Rei quer que eu leve uma mensagem a Pog, rei dos trolls, pedindo que ele tire as pedras da passagem até o posto avançado."

[system_Quest_log_troll_idol]
string="Um ídolo foi roubado dos trolls. Eles não vão me ajudar até que o objeto seja devolvido. Vou procurar na área goblin."

//newlog
[system_Quest_log_troll_idol_done]
string="A passagem para o posto avançado humano deve estar desobstruída agora."

[system_Quest_log_rituals]
string="Tem havido rituais de sacrifício perto do castelo. O Rei quer que eu descubra mais sobre isso. Aparentemente, pode ter relação com o assassinato de Falan Orbiplanax. Preciso interrogar o povo do reino."

[system_Quest_portal]
string="Chinkashh me mostrou o feitiço secreto para se teleportar pelos portões de Edurneum: Mega Spacium."

[system_Quest_log_shanny]
string="A filha de Maria, Shany, desapareceu. Maria pediu que eu a encontre — ela pode estar em perigo."

//newlog
[system_Quest_log_shanny_done]
string="Shany está a salvo. Cheguei bem a tempo, antes que ela fosse sacrificada."

[system_Quest_log_access_temple]
string="Agora preciso encontrar o caminho secreto até o Templo de Akbaa e destruir o meteoro."

[system_Quest_log_know_password]
string="Erzog me disse que o Templo de Akbaa fica debaixo da taverna e me deu a palavra secreta para entrar."

[system_Quest_log_destroy_meteor_for_good]
string="O meteoro resistiu ao meu ataque. É mais forte do que eu esperava. Preciso perguntar a Felnor sobre isso e explicar o que aconteceu."

[system_Quest_log_krahoz_zohark]
string="Preciso encontrar Krahoz e Zohark para impedir que o meteoro drene a mana do meu corpo. É o único jeito de destruir este meteoro e impedir que Akbaa se reencarne em Arx."

[system_Quest_log_krahoz]
string="Krahoz foi roubado por um grupo de rebeldes. Os mesmos que mataram a Rainha e sequestraram a filha do Rei. Preciso achar um jeito de localizá-los."

[system_Quest_log_zohark]
string="Zohark está com a Ordem de Edurneum. Preciso bater à porta deles — tenho certeza de que vão entender a importância vital da minha missão."

[system_Quest_log_Shield]
string="Encontrei a garota que salvei no Templo de Akbaa. Fiquei surpreso ao descobrir que ela é, na verdade, a líder dos rebeldes. Mas isso não importa. Tudo o que sei é que ela me dará Krahoz se eu encontrar um escudo para ela. Chama-se Escudo dos Ancestrais e fica no 2º nível da cripta."

//newlog
[system_Quest_log_Shield_done]
string="Tenho o poderoso Escudo dos Ancestrais."

//newlog
[system_Quest_log_mythril_done]
string="A arma definitiva agora é minha."

//newlog
[system_Quest_log_krahoz_done]
string="Tenho Krahoz."

//newlog
[system_Quest_log_zohark_done]
string="Tenho Zohark."

[system_Quest_log_Meteor_time]
string="Agora que tenho Krahoz e Zohark, é hora de voltar ao Templo de Akbaa e destruir este meteoro de uma vez por todas."

[system_Quest_log_Meteor_destroyed]
string="O meteoro foi destruído — as tramas de Akbaa acabaram. Ainda assim, estranhamente, Sylib Nurath não me chamou de volta ao Noden. Preciso voltar ao Reino e ver se encontro um jeito de regressar ao Noden."

[system_Quest_log_save_kingdom]
string="O povo do reino de Arx está prisioneiro dos Ylsides. Preciso ir à prisão e ver o que está acontecendo antes de deixar Arx e voltar ao Noden."

[system_Quest_log_super_weapon]
string="O reino foi restaurado. A armadilha de Iserbius falhou. Agora sei por que não fui chamado de volta ao Noden: minha missão ainda não acabou. Akbaa teve tempo de reunir energia suficiente antes que eu destruísse o meteoro. Destruí-lo ainda foi o melhor a fazer, pois Akbaa não ficará tão forte quanto esperava. Ele provavelmente está se fundindo com Iserbius neste momento. É um processo longo e a maioria das armas não terá efeito em Iserbius durante ele. Preciso criar a arma definitiva antes de enfrentar Akbaa."

[system_Quest_log_mythril]
string="O livro da arma definitiva diz que eu deveria fazer uma arma de mithril, pois é o único metal que se funde com ligas estranhas como o pó de Koltk. Espero que isso seja verdade."

[system_Quest_log_Dragon_egg]
string="Preciso encontrar um ovo de dragão para lançar um feitiço na arma."

[system_Quest_log_final_meeting]
string="Chegou a hora de cumprir minha missão: vou ao bunker dos Ylsides agora e destruir Iserbius... ou deveria dizer Akbaa."

[system_Quest_log_key_bank]
string="Encontrei uma chave lacrada na casa de Alicia. Se eu pudesse fazer um molde, conseguiria uma réplica da chave..."

//newlog
[system_Quest_log_key_bank_done]
string="Fiz uma réplica da chave na casa de Alicia..."

[system_Quest_log_olivier]
string="Ouvi um boato na taverna sobre uma caça ao tesouro organizada por um eremita chamado Oliver. Aparentemente, o jeito de começar é deixar uma esmeralda no baú dele."

//newlog
[system_Quest_log_olivier_done]
string="Resolvi a caça ao tesouro organizada por Oliver."

[system_Quest_log_Florence]
string="Encontrei um fantasma hoje. Ela pediu que eu encontre os responsáveis pela morte dela. Disse que era uma pessoa importante em Arx. Também disse que o assassino tinha só um olho."

//newlog
[system_Quest_log_Florence_done]
string="O mistério do fantasma foi resolvido. Carlo esteve na origem do assassinato da Rainha Florence."

[system_Quest_log_dragon_scale]
string="Quantas escamas pode ter um dragão? Preciso encontrar informações sobre isso."

[system_Quest_water_clan]
string="O clã da água goblin pediu que eu mate o clã da terra. Em troca, eles me darão um item mágico."

//newlog
[system_Quest_water_clan_done]
string="Matei o clã da terra."

[system_Quest_earth_clan]
string="O clã da terra goblin pediu que eu mate o clã da água. Em troca, eles me darão ouro do tesouro deles."

//newlog
[system_Quest_earth_clan_done]
string="Matei o clã da água."

