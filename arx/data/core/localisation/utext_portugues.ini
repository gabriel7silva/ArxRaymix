[book_calpal_journal]
string="Ano 238, Estação Verde, Segundo Dia da Semana da Aranha:*Carlo me pediu para seguir a Rainha. Missão estranha; ele tentou puxar o truque dos 'bons velhos tempos', da época em que eu era mercenário do reino, mas desta vez me certifiquei de ser pago por isto.**Ano 238, Estação Verde, 5º Dia da Semana do Gato:*enquanto seguia a Rainha, vi-a deixar uma carta atrás da estátua perto da cripta. Esperei até que ela fosse embora antes de copiar rapidamente o que estava escrito ali...*Tenho certeza de que Carlo ficará encantado com a minha descoberta.**Ano 238, Estação Verde, 6º Dia da Semana do Gato:*missão cumprida; a Rainha está morta e todos pensam que o grupo de rebeldes que sequestrou o herdeiro real foi o responsável."

//** this book is now in the human library
[description_book_traveler_guild]
string="A Guilda dos Viajantes, pelo sábio Dormal."

[book_traveler_guild_content]
string="A Guilda dos Viajantes foi a primeira instituição criada após a morte do sol de Arx.*Suas origens vêm de um punhado de sobreviventes obstinados que não quiseram se juntar ao resto da população no subsolo. Estes raros sobreviventes desenvolveram técnicas para resistir ao frio ingerindo drogas de alquimistas.**Construíram os próprios abrigos de gelo e criaram cães que também conseguiam resistir ao frio.*Foram juntados por outros homens e mulheres que não tinham medo do frio e que também queriam se aventurar até outras cidades.**Dessas jornadas nasceu a Guilda dos Viajantes, que agora é o único meio restante de comunicação entre as cidades subterrâneas. São sempre bem respeitados e ansiosamente recebidos, pois são as únicas pessoas capazes de trazer notícias de fora."

