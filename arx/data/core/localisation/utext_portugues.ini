[Sylib_noden_1]//~24@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Mais um... Por que os imortais nunca se contentam com a própria dimensão?... Mas esse é o nosso dever eterno, suponho: garantir que o equilíbrio universal seja mantido. Onde é a origem do canal de energia?"

[Noden_servant_2]//~06@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Um mundo sem nada de especial chamado Exosta. O suplicante morreu antes de terminar a comunicação.. O que devemos fazer, Senhor?"

[Sylib_noden_2]//}~24@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Enviemos um Guardião..."

[Sylib_briefing_1]//{~24~00@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Bem-vindo, Guardião. Permita-me explicar sua próxima missão. Você conhece as regras do Noden, a dimensão dos deuses e dos príncipes demônios. Nenhum ser de poder tem permissão para deixar esta dimensão. Mas Akbaa se prepara para invadir um mundo chamado Arx. Um grupo de seus seguidores está tentando invocá-lo neste momento. Você sabe que isso não pode acontecer. Não podemos combater Akbaa daqui, pois nada podemos impor aos deuses. Então, vamos enviá-lo para destruir este culto que o adora e, sem a adoração dos seguidores, o poder dele diminuirá a níveis aceitáveis..."

[player_noden_briefing_1]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Destruirei este culto, Mestre."

[Sylib_briefing_2]//~24@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Não será uma tarefa simples. Para esta missão, vamos lhe conceder uma habilidade específica que lhe permitirá destruir a rocha Koltk ligada ao poder de Akbaa. Ela é imune a ataques mortais. Esta rocha é a origem do problema, pois canaliza a energia dada pelos seguidores de Akbaa. Em breve, Akbaa terá energia suficiente para completar sua encarnação em Arx."

[player_noden_briefing_2]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Entendo, Mestre... Terei um contato em Arx?"

[Sylib_briefing_3]//~24@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Seu contato morreu durante a transmissão da mensagem. Você terá de se virar sozinho quando chegar lá. Isso é extremamente preocupante, pois o choque da passagem é desastroso para a memória de um Guardião. Você poderá ficar desorientado por um tempo, até sua memória voltar e você se lembrar desta conversa. Mas não há outro jeito..."

[Sylib_noden_briefing_4]//}~24@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Prepare-se, você está prestes a ser transportado. Eu o trarei de volta quando tiver concluído sua missão..."

[Erzog_iserbius]//{~10~03@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Tenha piedade, Mestre, ele me ameaçou... piedade..."

[Iserbius_erzog]//}~03@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Vamos, vamos, Erzog, você sabe muito bem que todos devemos fazer nossa parte pela causa com os poderes débeis que cada um de nós possui... Mas console-se: seu modesto sacrifício não será em vão..."

[Iserbius_call_ylside]//~3
