[dragon_explain_guardian4]//~27
String="Faz tanto tempo que não vejo um dos enviados dos Noden! Fico feliz que você não tenha tido muita dificuldade para recuperar a memória... Ser um Guardião tem suas vantagens, mas às vezes também tem seus inconvenientes..."

[player_question_dragon]//~00
String="Como assim?"

[dragon_explain_guardian5]//~27
String="Bem, parece que um Guardião desenvolve uma espécie de presciência, uma capacidade de se mover no tempo que lhe dá uma nova visão de situações críticas que, de outro modo, o levariam a um beco sem saída ou à derrota. Você deve ter conseguido sentir isso, mesmo que talvez não tenha percebido. Na verdade, saiba disto: você está destinado a vencer. Não hesite em usar essa habilidade, pois ela lhe será de grande serventia..."

[player_question_dragon2]//~00
String="Tenho outros poderes que ainda não conheço?"

[dragon_explain_guardian6]//}~27
String="Acho que não. Faz muito tempo que os líderes dos Noden não dão grandes poderes aos seus Guardiões... às vezes o remédio é pior que a doença... O que me leva à sua principal fraqueza: como uma das criaturas dos Noden, você parece humano e não é nativo desta dimensão. Você é livre para fazer quase tudo, mas não tudo - sua ignorância desta dimensão, somada ao que os Noden incutiram em você, de que provavelmente não tem lembrança, muitas vezes fará você se perder: talvez certas conversas que terá não aconteçam como você esperava, as palavras que saírem da sua boca não serão as que você teria escolhido, nem mesmo as que gostaria de dizer. Não se preocupe, Guardião. Você sempre será um estranho em Arx, longe das considerações humanas."

[player_dragon6]//{~00~27
