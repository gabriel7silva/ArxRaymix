[Zalnashh_you_will]//~21@maliciously@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="You will find it... Unless perhaps you already have it... But that's not the problem. For now, destroying Akbaa has to be the priority. You must emerge victorious from the Discernment Challenge. It is an ordeal which must be attempted by each new recruit to our Order: You have to succeed in passing through the Temple of Illusions. If you do, you may take Zohark and you will also be protected against all the illusions Akbaa will try to use on you."

[Zalnashh_gives_orb_illusion]//}~21
